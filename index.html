<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMPLY LOVELY</title>
<meta name="theme-color" content="#0F1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SIMPLY LOVELY">
<meta name="description" content="F1 시즌 일정·세션별 결과·드라이버 시즌 성적을 한 화면에서 보는 모바일 웹 앱">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}
:root{
  --bg:#0F1014;--card:#181A20;--card2:#1D2028;--line:#272B33;--line2:#343943;
  --txt:#F2F3F5;--dim:#98A0AB;--dim2:#6E7681;--red:#E10600;--gold:#FFD24A;--purple:#C97BFF;
  --safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px);
}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--txt);font-size:14px;line-height:1.35;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(680px 300px at 50% -140px,rgba(225,6,0,.30),rgba(225,6,0,.06) 55%,transparent 72%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input{font:inherit}
a{color:inherit;text-decoration:none}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;padding-top:calc(var(--safet) + 6px);
  background:rgba(15,16,20,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:10px;padding:11px 14px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand:active .tt h1{opacity:.72}
.mark-img{width:34px;height:34px;border-radius:9px;flex:0 0 auto;object-fit:cover;display:block;border:1px solid rgba(255,255,255,.12)}
.brand .tt{flex:1;min-width:0}
.brand h1{margin:0;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brand .sub{color:var(--dim2);font-size:9.5px;letter-spacing:.2em;font-weight:800;margin-top:1px}
.livebtn{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.06em;
  color:var(--dim);background:#1A1D24;border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.livebtn.busy{opacity:.62;pointer-events:none;color:#fff;border-color:#4A505C}
.livebtn.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:6px;height:6px;border-radius:50%;background:#00D26A;box-shadow:0 0 8px #00D26A}
.years{display:flex;gap:6px;overflow-x:auto;padding:13px 12px 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.years::-webkit-scrollbar{display:none}
.y{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#16191F;
  color:var(--dim);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;transition:.15s}
.y:active{transform:scale(.96)}
.y.on{background:#fff;border-color:#fff;color:#0F1014;box-shadow:0 4px 14px rgba(255,255,255,.18)}

/* ---------- layout ---------- */
main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:10px 12px calc(80px + var(--safeb))}
.secttl{display:flex;align-items:baseline;gap:8px;padding:4px 2px 9px;font-size:13px;font-weight:900;letter-spacing:.02em}
.secttl .dim{font-weight:700;font-size:11px;color:var(--dim2);letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card+.card{margin-top:10px}

/* ---------- race header ---------- */
.rhd{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.rhd .ttl{flex:1;min-width:0;text-align:center}
.rhd .rno{display:block;color:var(--red);font-weight:900;font-size:10.5px;letter-spacing:.14em;text-align:center}
.rhd h2{margin:3px 0 0;font-size:19px;font-weight:900;letter-spacing:-.35px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.rhd .meta{display:block;color:var(--dim2);font-size:11.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.step{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:#171A20;border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--dim)}
.step:active{background:#20242C;color:#fff}
.step[disabled]{opacity:.3}
/* 제목 옆 동그란 화살표만 그랑프리 선택 시트를 연다(제목·날짜·여백은 반응 없음) */
.gpttl{display:block;width:100%;min-width:0;padding:1px 2px 2px;border-radius:10px;text-align:center}
.gpttl .gt{margin:3px 0 0;font-size:19px;font-weight:900;letter-spacing:-.35px;line-height:1.15;
  display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;min-width:0}
.gpttl .gt .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpttl .gcar{position:relative;flex:0 0 auto;width:18px;height:18px;border-radius:6px;background:#232830;
  border:1px solid var(--line2);display:grid;place-items:center;color:var(--dim);padding:0}
.gpttl .gcar:after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;
  transform:translate(-50%,-50%);border-radius:50%}
.gpttl .gcar:active{background:#2E343E;color:#fff}

/* ---------- 그랑프리 빠른 선택 바텀시트 ---------- */
.sheetwrap{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
.sheetbg{position:absolute;inset:0;background:rgba(6,7,9,.66);animation:fadein .16s ease both}
.sheet{position:relative;width:100%;max-width:520px;
  max-height:72vh;max-height:calc(100dvh - 120px - env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;
  background:#181A20;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);padding-bottom:var(--safeb);
  animation:sheetup .26s cubic-bezier(.22,.86,.3,1) both}
.sheet:before{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);
  width:36px;height:4px;border-radius:3px;background:#3A404B}
.sheet-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:17px 14px 11px;border-bottom:1px solid var(--line)}
.sheet-hd .t{flex:1;min-width:0}
.sheet-hd b{display:block;font-size:13.5px;font-weight:900;letter-spacing:-.1px}
.sheet-hd span{display:block;font-size:10.5px;color:var(--dim2);font-weight:700;margin-top:2px}
.sheet-x{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#20242C;border:1px solid var(--line2);
  display:grid;place-items:center;color:var(--dim);font-size:12px;font-weight:900}
.sheet-x:active{background:#2A3038;color:#fff}
.sheet-list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:7px 8px 12px}
.gpi{display:flex;align-items:center;gap:9px;width:100%;padding:9px 8px;border-radius:12px;
  border:1px solid transparent;transition:background .12s}
.gpi+.gpi{margin-top:2px}
.gpi:active{background:#21252D}
.gpi.on{background:rgba(225,6,0,.13);border-color:rgba(225,6,0,.42)}
.gpi .rn2{flex:0 0 auto;width:30px;text-align:center;font-weight:900;font-size:11px;
  color:var(--dim2);font-variant-numeric:tabular-nums}
.gpi.on .rn2{color:#FF6B62}
.gpi .mn{flex:1;min-width:0}
.gpi .nm2{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden}
.gpi .nm2 .g{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpi .sb{display:block;font-size:10.5px;color:var(--dim2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpi .st2{flex:0 0 auto}
.badge.cur{background:rgba(225,6,0,.18);color:#FF8A83;border:1px solid rgba(225,6,0,.4)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(24px);opacity:.55}to{transform:translateY(0);opacity:1}}
@keyframes sheetpop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:700px){.sheetwrap{align-items:center;padding-top:24px;height:auto;bottom:0}
 .sheet{max-height:74vh;max-height:min(74dvh,calc(100dvh - 48px));border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:0;
   box-shadow:0 24px 70px rgba(0,0,0,.6);animation:sheetpop .2s ease both}
 .sheet:before{display:none}}

/* ---------- 2026 라스베이거스 GP 그리드 페널티 사유(1번 안: 행 바로 아래 아코디언) ---------- */
.tbl tr.grtap{cursor:pointer}
.tbl tr.grtap:active td{background:#1E222A}
.tbl tr.gropen td{background:rgba(255,107,98,.08)}
.tbl tr.grid-reason-row td{border-top:none;text-align:left;padding:2px 10px 10px 44px;
  background:rgba(255,107,98,.05)}
.gracc{background:#1A1D24;border:1px solid rgba(255,107,98,.35);border-radius:10px;padding:9px 11px;
  font-size:12px;line-height:1.45;color:#E8ECF2;text-align:left}
.gracc .grl1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;text-align:left}
.gracc .grb{display:inline-flex;align-items:center;font-size:10.5px;font-weight:900;letter-spacing:-.01em;
  padding:3px 7px;border-radius:7px;background:rgba(255,107,98,.18);color:#FF6B62;white-space:nowrap}
.gracc .grp{font-size:11.5px;font-weight:800;color:#D3D8DF;letter-spacing:-.01em}
.gracc .grr{margin-top:5px;text-align:left;word-break:keep-all}
.gracc .grsrc{margin-top:4px;font-size:10.5px;color:#7C8594;font-weight:700;text-align:left}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabwrap{display:flex;flex:0 0 auto;gap:5px;margin:0 auto;padding:0 1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:#171A20;border:1px solid var(--line);
  font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap;transition:.15s;letter-spacing:-.01em}
.tab:active{transform:scale(.97)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 5px 16px rgba(225,6,0,.36)}
.tab .cnt{font-size:9.5px;opacity:.75;margin-left:3px}

/* ---------- table ---------- */
.card.pad{padding:0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:800;
  padding:9px 8px 7px;text-align:right;background:#141720;border-bottom:1px solid var(--line);position:sticky;top:0}
.tbl th:first-child{text-align:center;width:34px;padding-left:10px}
.tbl th.d{text-align:left}
.tbl td{padding:8px;border-top:1px solid #20242B;font-size:12.5px;text-align:right;color:#D3D8DF}
.tbl tr:first-child td{border-top:0}
.tbl td.p{width:34px;text-align:center;font-weight:900;color:var(--dim);padding-left:10px;font-size:12px}
.tbl td.d{text-align:left;padding-left:6px}
.tbl tr.p1 td.p{color:var(--gold)}
.tbl tr.p2 td.p{color:#DCE1E8}
.tbl tr.p3 td.p{color:#D08B4E}
/* 드라이버 상세 라운드 번호는 결과(우승·포디움)와 무관하게 항상 기본 회색 */
.tbl tr.p1 td.p.rd,.tbl tr.p2 td.p.rd,.tbl tr.p3 td.p.rd,.tbl tr td.p.rd{color:var(--dim)}
.tbl td.tm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;letter-spacing:-.2px}
.tbl td.tm .flt{display:block;color:var(--purple);font-size:10.5px;font-weight:700;margin-top:2px;
  font-variant-numeric:tabular-nums;letter-spacing:-.1px;line-height:1.15;white-space:nowrap}
.tbl td.pt{font-weight:900;color:#fff;width:40px}
/* 연습주행(FP1·FP2·FP3)·퀄리파잉·SQ: 세션 데이터 길이와 무관하게 열 폭·간격 고정(colgroup 값 사용) */
.tbl.fx{table-layout:fixed}
@media(max-width:360px){.tbl.fx th,.tbl.fx td{padding-left:4px;padding-right:4px}}
.tbl td.pt.zero{color:var(--dim2);font-weight:700}
/* 드라이버 상세 · 스프린트 주말 3행(그랑프리 헤더 / 스프린트 / 레이스) */
.tbl td.gph{text-align:left;padding:7px 8px 5px 6px;border-top:1px solid #20242B;
  border-bottom:0}
.tbl td.gph .gpn{font-weight:700;font-size:12px;color:#F2F3F5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tbl td.gph .ln{margin-top:0}
.tbl td.subd{text-align:left;padding-left:15px;padding-top:7px;padding-bottom:7px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
/* 스프린트 주말 3행: 그랑프리 사이 구분선(레이스 행 아래)만 남기고 나머지 선은 두지 않는다.
   그랑프리 제목·날짜 아래 간격은 그대로 두고, 스프린트·레이스 두 줄만 바짝 붙인다. */
.tbl tr.srow td{border-top:0;border-bottom:0;padding-top:8px;padding-bottom:2px}
.tbl tr.rrow td{border-top:0;border-bottom:1px solid var(--line);padding-top:2px;padding-bottom:8px}
.drv{display:flex;align-items:center;gap:7px;min-width:0}
.bar{width:3px;height:20px;border-radius:2px;flex:0 0 3px}
.code{font-weight:900;font-size:12.5px;letter-spacing:.03em}
.ln{color:var(--dim);font-size:10px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln.wrap{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;word-break:break-word}
.fl{color:var(--purple);font-size:9px;font-weight:900;margin-left:4px;vertical-align:top}
.dotd{color:var(--gold);font-size:9px;font-weight:900;margin-left:4px;vertical-align:top}
.pos-txt{font-size:10px;color:var(--dim2);font-weight:700}

/* ---------- misc ---------- */
.summary{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  box-sizing:border-box;min-height:43px;
  background:linear-gradient(180deg,#1B1E26,#181A20);font-size:11.5px;color:var(--dim)}
.summary b{color:#fff;font-weight:900}
.summary .sp{flex:1}
/* 카드 상단 제목 오른쪽: 직전 연도 같은 그랑프리 결과로 가는 작은 배지 */
.summary>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvbg,.bak{flex:0 0 auto;display:inline-flex;align-items:center;gap:2px;padding:2px 7px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--dim);
  font-size:10.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;line-height:1.5}
.pvbg:active,.bak:active{background:#232830;color:#fff;border-color:#4A505C}
/* 그리드 카드 오른쪽 서킷명: 복귀·직전연도 버튼이 함께 떠도 한 줄 안에서 말줄임 */
.summary .cr{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary .wn{display:inline-flex;align-items:center;gap:5px;min-width:0}
.summary .wn .lb{flex:0 0 auto;color:var(--dim2);font-size:10.5px;font-weight:800;letter-spacing:0}
.summary .wn .bar{height:12px;border-radius:2px}
.summary .wn .nm{min-width:0;color:#fff;font-size:11.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:5px;
  vertical-align:middle;font-style:normal}
.badge.sp{background:rgba(225,6,0,.16);color:#FF6B62;border:1px solid rgba(225,6,0,.35)}
.badge.up{background:#1E222A;color:var(--dim2);border:1px solid var(--line2)}
.badge.done{background:rgba(0,210,106,.12);color:#43E08C;border:1px solid rgba(0,210,106,.28)}
.note{padding:34px 18px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.6}
/* 안내 카드 제목: .note 안내 박스와 시작 전 카드가 같은 크기·굵기를 쓴다 */
.note b,.pre-t{color:#fff;font-size:15px;font-weight:900;letter-spacing:-.01em}
.note b{display:block;margin-bottom:6px}
.note .kbd{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:10px;background:#20242C;
  border:1px solid var(--line2);color:#fff;font-weight:800;font-size:12px}
/* 그리드 없음 안내: 한국어 단어가 중간에 끊기지 않도록 */
.note.keepall{word-break:keep-all}
/* 시작 전 세션 안내 카드 */
.pre{padding:28px 16px 32px;text-align:center}
.pre-s{margin-top:7px;color:var(--txt);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;opacity:.92}
.pre-n{margin-top:7px;color:var(--dim2);font-size:11.5px}
.cdpill{display:inline-flex;align-items:center;gap:7px;margin-top:18px;padding:8px 15px;border-radius:999px;
  background:rgba(225,6,0,.13);border:1px solid rgba(225,6,0,.38);color:#FF8079;
  font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cdpill .cdd{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(225,6,0,.18);flex:0 0 6px}

/* ---------- schedule list ---------- */
.rowitem{display:flex;align-items:center;gap:7px;width:100%;padding:11px 12px;border-top:1px solid #20242B;transition:.12s}
.rowitem:first-child{border-top:0}
.rowitem:active{background:#1E222A}
.rn{width:22px;flex:0 0 auto;text-align:center;font-weight:900;font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
.ri-main{flex:1;min-width:0}
.ri-top{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden}
.ri-sub{display:block;color:var(--dim2);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-right{flex:0 0 auto;display:flex;align-items:center;gap:4px}
/* 포디움 배지: 3열 고정 폭 그리드 + 내부 고정 폭 → 모든 행에서 1·2·3위 배지/막대/코드가 세로 일자로 정렬된다 */
.pd{display:grid;grid-template-columns:repeat(3,52px);gap:3px;align-items:center;flex:0 0 auto}
.pdb{background:#1E222A;border:1px solid var(--line);border-radius:999px;padding:3px 0;width:100%;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.pdb .pn{width:8px;flex:0 0 8px;text-align:center;font-size:10.5px;font-weight:700;color:var(--txt);
  font-variant-numeric:tabular-nums}
.pdb .pb{width:2.5px;height:10px;border-radius:2px;flex:0 0 2.5px}
.pdb .pc{width:25px;flex:0 0 25px;text-align:center;font-size:10.5px;font-weight:900;color:var(--txt)}
.chev{color:var(--dim2);font-size:15px;font-weight:700}
@media(min-width:700px){.list{display:grid;grid-template-columns:1fr 1fr}.rowitem{border-top:1px solid #20242B}
 .list .rowitem:nth-child(2){border-top:0}.list .rowitem:nth-child(odd){border-right:1px solid #20242B}}
@media(min-width:700px){main{max-width:740px}}

/* ---------- standings ---------- */
.seg{display:flex;gap:4px;background:#141720;border:1px solid var(--line);border-radius:11px;padding:3px;margin:0 0 10px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;border-radius:8px;font-size:12px;font-weight:800;color:var(--dim)}
.seg button.on{background:#2A2F38;color:#fff}
.ptbar{position:relative;height:4px;border-radius:3px;background:#232830;margin-top:6px;overflow:hidden}
.ptbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:block}

/* ---------- search ---------- */
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{width:100%;padding:13px 14px 13px 40px;border-radius:14px;background:#171A20;
  border:1px solid var(--line);color:#fff;font-size:14px;outline:none}
.searchbox input:focus{border-color:#4A505C;background:#1B1F26}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.55}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.chip{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;min-width:0;
  padding:7px 4px;border-radius:999px;background:#171A20;white-space:nowrap;
  border:1px solid var(--line);font-size:12px;font-weight:800;color:#D3D8DF}
.chip .bar{height:13px;width:2.5px}
.chip:active{background:#1F232B}
/* 넓은 화면에서는 폭에 맞춰 열 수를 늘려 칩이 과하게 늘어나지 않게 */
@media(min-width:700px){.chips{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}

/* ---------- driver detail ---------- */
.dhd{padding:14px 14px 12px;background:linear-gradient(160deg,#20242D,#181A20);position:relative;overflow:hidden}
.dhd .acc{position:absolute;left:0;top:0;bottom:0;width:4px}
.dhd .nm{font-size:20px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.dhd .en{color:var(--dim2);font-size:11px;margin-top:3px;letter-spacing:.06em;font-weight:700}
.dhd .tm2{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--dim);font-weight:700}
/* 생년월일 · 국기 국적 */
.dhd .db{margin-top:3px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
/* 드라이버 상세: 우승·폴 포지션 좌우 2단 카드(제목에 숫자 없음, 0회는 -) */
.hl{display:grid;grid-template-columns:1fr 1fr}
.hlc{padding:11px 10px 12px;min-width:0;text-align:center}
.hlc+.hlc{border-left:1px solid var(--line)}
.hlt{font-size:13px;font-weight:900;letter-spacing:-.01em;line-height:1.2;margin-bottom:6px}
.hlt.g{color:#F5A623}
.hlt.p{color:#CA99F2}
.hi{display:block;width:100%;padding:0;font-size:12.5px;font-weight:700;color:#E8EAEE;
  line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.hi:active{color:#fff}
.hle{font-size:12.5px;font-weight:700;color:var(--dim2);line-height:1.55}
.stat{background:#181A20;padding:11px 6px;text-align:center}
.stat .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat .k{font-size:9.5px;color:var(--dim2);font-weight:800;letter-spacing:.08em;margin-top:3px;text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--dim);padding:8px 2px 10px}
.back:active{color:#fff}
.delta{font-weight:900;font-size:11px;letter-spacing:-.02em}
.delta.up{color:#43E08C}
.delta.dn{color:#FF6B62}
.delta.eq{color:var(--dim2)}
.pill{display:inline-block;font-size:9.5px;font-weight:900;padding:1px 5px;border-radius:4px;background:#2A2F38;color:#D3D8DF;letter-spacing:.02em}
.pill.pl{background:rgba(255,159,10,.16);color:#FFB347}
.seg.mini{margin:0;padding:2px;border-radius:9px}
.seg.mini button{padding:5px 10px;font-size:11px}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding-bottom:var(--safeb);
  background:rgba(15,16,20,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.07)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;
  font-size:10px;font-weight:800;color:var(--dim2);letter-spacing:.02em}
nav button.on{color:#fff}
nav button.on svg{color:var(--red)}
nav svg{color:var(--dim2)}
@media(min-width:700px){nav{left:50%;right:auto;width:740px;max-width:none;transform:translateX(-50%)}}

/* ---------- states ---------- */
.sk{padding:12px}
.sk i{display:block;height:13px;border-radius:6px;margin-bottom:9px;
  background:linear-gradient(90deg,#1C2027,#262B34,#1C2027);background-size:200% 100%;animation:sh 1.1s infinite}
.sk i:nth-child(2){width:88%}.sk i:nth-child(3){width:94%}.sk i:nth-child(4){width:70%}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-60% 0}}
.err{padding:30px 18px;text-align:center;color:#FFB4AE;font-size:12.5px}
.err b{display:block;color:#fff;margin-bottom:6px}
.err .kbd{display:inline-block;margin-top:12px;padding:8px 16px;border-radius:10px;background:#2A1A1A;
  border:1px solid #5A2A26;color:#fff;font-weight:800;font-size:12px}
.footnote{text-align:center;color:var(--dim2);font-size:10px;padding:16px 8px 4px;line-height:1.7;word-break:keep-all}

/* ---------- 드라이버 1:1 비교 ---------- */
.h2hpick{display:grid;grid-template-columns:1fr 16px 1fr;gap:6px;align-items:center;padding:10px}
.h2hc{position:relative;display:block;width:100%;min-width:0;background:#1D2028;border:1px solid var(--line);
  border-radius:13px;padding:9px 20px 10px 12px;text-align:left;transition:background .12s}
.h2hc:active{background:#22262E}
.h2hc .bar{position:absolute;left:0;top:9px;bottom:9px;height:auto;width:3px;border-radius:2px}
.h2hc .cd{display:block;font-size:18px;font-weight:900;letter-spacing:.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2hc .nm{display:block;font-size:10.5px;color:var(--dim);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.h2hc .tm{display:block;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.h2hc .cv{position:absolute;right:8px;top:10px;color:var(--dim2);display:block;line-height:1}
.h2hc .cv svg{width:9px;height:9px}
.h2hvs{display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--dim2);letter-spacing:.04em}
.h2htools{display:flex;gap:6px;justify-content:center;padding:0 10px 11px}
.h2htool{font-size:10.5px;font-weight:800;color:var(--dim);background:#1A1D24;border:1px solid var(--line);
  border-radius:999px;padding:5px 10px;transition:.12s}
.h2htool:active{color:#fff;border-color:var(--line2);background:#22262E}
.h2hrow{padding:9px 12px 10px;border-top:1px solid var(--line)}
.h2hrow:first-child{border-top:0}
.h2htop{display:flex;align-items:center;gap:6px}
.h2htop .v{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;min-width:36px;letter-spacing:-.3px}
.h2htop .v.r{text-align:right}
.h2htop .lb{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2hbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#232830;margin-top:7px}
.h2hbar i{display:block;height:100%}
.h2hsm{font-size:9.5px;color:var(--dim2);font-weight:700;text-align:center;padding-top:5px}
table.tbl.h2ht th.ca,table.tbl.h2ht td.ca,table.tbl.h2ht th.cb,table.tbl.h2ht td.cb{
  width:47px;min-width:47px;text-align:center;padding:7px 4px}
table.tbl.h2ht td.ca{padding-right:2px}
table.tbl.h2ht th.ca{padding-right:2px;color:#DCE1E8}
table.tbl.h2ht th.cb{color:#DCE1E8}
.h2hpill{display:inline-block;min-width:31px;text-align:center;padding:2px 5px;border-radius:8px;
  font-size:11.5px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;line-height:1.25}
.h2hplain{font-size:12px;font-weight:800;color:#D3D8DF;font-variant-numeric:tabular-nums}
.h2hplain.dim{color:var(--dim2);font-weight:700}
.h2hnow{font-size:10.5px;color:var(--dim2);font-weight:700;text-align:center;padding:4px 12px 12px;line-height:1.6}
.hide{display:none!important}
</style>

var KST_MS=9*3600*1000;
/* 'YYYY-MM-DDTHH:MM:SSZ' 형태로 정규화(시간 표기가 없거나 Z가 빠져도 보정). 파싱 불가면 null */
function normISO(v){
  if(!v) return null;
  var s=String(v);
  if(!/T/.test(s)) s=s+'T00:00:00Z';
  else if(!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) s=s+'Z';
  return isNaN(Date.parse(s))?null:s;
}
/* Jolpica race 객체에서 고른 세션의 시작 시각(UTC ISO). 그리드·정보 없음은 null */
function sessionISOFromRace(race,kind){
  if(!race) return null;
  var f=null;
  if(kind==='fp1') f=race.fp1;
  else if(kind==='fp2') f=race.fp2;
  else if(kind==='fp3') f=race.fp3;
  else if(kind==='sq') f=race.sq;
  else if(kind==='sprint') f=race.sp;
  else if(kind==='quali') f=race.q;
  else if(kind==='grid') return null;
  else if(kind==='race') f=race.time?(race.date+'T'+race.time):(race.date+'T00:00:00Z');
  return normISO(f);
}
/* UTC ISO → KST 달력 값 */
function kstDate(iso){ var t=Date.parse(iso); return isNaN(t)?null:new Date(t+KST_MS); }
function fmtKSTDate(iso){
  var d=kstDate(iso); if(!d) return '';
  return pad2(d.getUTCMonth()+1)+'.'+pad2(d.getUTCDate())+' ('+'일월화수목금토'[d.getUTCDay()]+')';
}
function fmtKSTTime(iso){
  var d=kstDate(iso); if(!d) return '';
  return pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes());
}

   레이스 탭은 일정 목록·배지와 같은 경기 날짜(서킷 기준 date)를 그대로 쓴다. */
function headerDateText(race,kind){
  if(kind==='race' || kind==='grid') return fmtDate(race.date);

  return iso?fmtKSTDate(iso):fmtDate(race.date);
}
function lapTime(sec){
  if(sec==null||sec===''||isNaN(sec)) return '—';
  sec=+sec;
  if(sec<=0) return '—';
  var m=Math.floor(sec/60);
  var s=sec-m*60;
  return m>0 ? (m+':'+s.toFixed(3).padStart(6,'0')) : s.toFixed(3);
}

function nameCase(s){

function lsGet(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function memo(key,ttl,fn){
  if(Object.prototype.hasOwnProperty.call(MEM,key)) return Promise.resolve(MEM[key]);
  var hit=lsGet('f1h:v1:'+key);
  if(hit && hit.t && (Date.now()-hit.t)<ttl && hit.v!==undefined){ MEM[key]=hit.v; return Promise.resolve(hit.v); }
  return fn().then(function(v){
    MEM[key]=v; lsSet('f1h:v1:'+key,{t:Date.now(),v:v}); return v;
  });
}
function jget(url,tries){
  tries=tries||3;
  var attempt=function(n){
    return fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){
      if(r.status===429){ var e=new Error('rate'); e.rate=true; throw e; }
      if(!r.ok){ var he=new Error('HTTP '+r.status); he.status=r.status; throw he; }
      return r.json();
    }).then(function(j){
      if(j && !Array.isArray(j) && j.detail) throw new Error(String(j.detail));
      return j;
    }).catch(function(e){
      if(n<=1){
        var hint=/^file:/.test(location.protocol) ? ' 파일을 직접 열었다면 브라우저 보안 정책으로 외부 데이터를 못 불러올 수 있습니다(2026 시즌은 내장 데이터로 표시).' : '';
        var fe=new Error(e.rate
          ? 'API 요청이 잠시 제한되었습니다(429). 1~2분 뒤 [다시 시도]를 눌러 주세요. 이미 본 화면은 그대로 볼 수 있습니다.'+hint
          : '데이터를 불러오지 못했습니다 ('+String(url).split('/').slice(-1)[0]+').'+hint);
        fe.status=e.status||0; fe.detail=e.message||'';
        throw fe;
      }
      return sleep(e.rate?3200:500*(4-n)).then(function(){return attempt(n-1);});
    });
  };
  return attempt(tries);
}

function lsFresh(k,ttl){
  var hit=lsGet(storeKey(k));
  if(!hit || hit.t==null || hit.v===undefined) return null;
  if(SYNC.at && hit.t<SYNC.at) return null;   /* 동기화 이후에 받은 값만 신뢰 */
  if(ttl && (Date.now()-hit.t)>=ttl) return null;

}
function liveFetch(key,fetchFn){
  if(PEND[key]) return PEND[key];
  var p=Promise.resolve().then(fetchFn).then(function(v){
    lsSet(storeKey(key),{t:Date.now(),v:v}); delete PEND[key]; return v;
  },function(e){ delete PEND[key]; throw e; });
  PEND[key]=p;
  return p;
}

function getStandings(year){

var KIND_PATH={race:'results',quali:'qualifying',sprint:'sprint'};
var KIND_FIELD={race:'Results',quali:'QualifyingResults',sprint:'SprintResults'};

function getRoundRaw(year,round,kind){
  var s=seasonObj(year);
  var key=kind+':'+round;
  if(s.rounds[key]) return Promise.resolve(s.rounds[key]);
  var p;
  if(year!==CACHE.year){
    p = memo('rd:'+year+':'+round+':'+kind,ttlFor(year),function(){
      return jget(JOL+'/'+year+'/'+round+'/'+KIND_PATH[kind]+'.json?limit=100').then(function(d){
        var rs=(d.MRData && d.MRData.RaceTable && d.MRData.RaceTable.Races)||[];
        return (rs[0] && rs[0][KIND_FIELD[kind]])||[];
      });
    });
  } else {
    var map=roundCacheMap(kind);
    var emb=(map && map[String(round)])?map[String(round)]:null;
    var rkey='rd:'+year+':'+round+':'+kind;
    var live=function(){
      return liveFetch(rkey,function(){
        return jget(JOL+'/'+year+'/'+round+'/'+KIND_PATH[kind]+'.json?limit=100').then(function(d){
          var rs=(d.MRData && d.MRData.RaceTable && d.MRData.RaceTable.Races)||[];
          return (rs[0] && rs[0][KIND_FIELD[kind]])||[];
        });
      });
    };
    var fresh=lsFresh(rkey,ttlFor(year));
    if(emb && emb.length && !syncForced()){
      p=Promise.resolve(emb);              /* 이미 끝난 라운드는 내장 값 재사용 */
    } else if(syncForced()){
      p=live().then(function(rows){
        if(rows && rows.length) applyRound(kind,round,rows);
        return (rows && rows.length)?rows:(emb||[]);
      },function(){ return emb||[]; });
    } else if(fresh!==null){
      if(fresh && fresh.length) applyRound(kind,round,fresh);
      p=Promise.resolve(fresh);
    } else if(roundMayHaveData(rawRace(round))){
      p=live().then(function(rows){
        if(rows && rows.length) applyRound(kind,round,rows);
        return rows||[];
      },function(){ return []; });      /* 오프라인·실패 시엔 조용히 빈 값 */
    } else {
      p=Promise.resolve([]);              /* 아직 경기 전 라운드 */
    }
  }
  return p.then(function(rows){
    rows=rows||[];
    if(rows.length) s.rounds[key]=rows;   /* 빈 결과는 캐시하지 않는다 */
    return rows;
  });
}
function getRoundRows(year,round,kind){
  return getRoundRaw(year,round,kind).then(function(raw){
    return raw.map(kind==='quali'?normQualiRow:normRaceRow);
  });
}

/* 시즌 전체(검색용) */
function fetchAllRounds(year,kind){
  var out={},offset=0,total=Infinity,guard=0;
  var step=function(){
    if(offset>=total || guard>40) return Promise.resolve(out);
    guard++;
    return jget(JOL+'/'+year+'/'+KIND_PATH[kind]+'.json?limit=100&offset='+offset).then(function(d){
      var md=d.MRData,rs=(md.RaceTable&&md.RaceTable.Races)||[];
      total=num(md.total);
      for(var i=0;i<rs.length;i++){
        var r=rs[i],k=String(r.round);
        var arr=out[k]||(out[k]=[]);
        var add=r[KIND_FIELD[kind]]||[];
        for(var j=0;j<add.length;j++) arr.push(add[j]);
      }
      offset+=num(md.limit)||100;
      if(!rs.length) offset=total;
      return sleep(220).then(step);
    });
  };
  return step();
}
function getSeasonMap(year,kind){
  var s=seasonObj(year);
  if(s.all[kind]) return Promise.resolve(s.all[kind]);
  if(year!==CACHE.year){
    return memo('all:'+year+':'+kind,ttlFor(year),function(){ return fetchAllRounds(year,kind); })
      .then(function(map){ s.all[kind]=map||{}; return s.all[kind]; });
  }
  var base=roundCacheMap(kind)||{};
  var miss=missingDoneRounds(kind);
  if(!miss.length){ s.all[kind]=base; return Promise.resolve(base); }
  /* 끝난 라운드가 내장 데이터에 없으면 그 라운드만 라이브로 보충한다 */
  return Promise.all(miss.map(function(rnd){
    return getRoundRaw(year,rnd,kind).then(function(rows){ return (rows&&rows.length)?1:0; },function(){ return 0; });
  })).then(function(ok){
    var map=roundCacheMap(kind)||base;
    if(ok.length && ok.every(function(x){ return !!x; })) s.all[kind]=map;
    return map;
  });
}

/* ============================ DOTD(오늘의 드라이버) ============================ */
/* 수상자 출처: TracingInsights/DOTD (raw.githubusercontent.com · CORS 허용).
   현재 시즌은 내장 CACHE.dotd로 즉시 그리고 백그라운드로 갱신(15분 TTL),
   지난 시즌은 30일 캐시로 조회한다. 득표율(%)은 표시하지 않는다. */
var DOTD_MIN=2016;
var DOTD_BASE='https://raw.githubusercontent.com/TracingInsights/DOTD/main/';
var DOTD_ALIAS={saopaulo:'brazilian'};   /* 2026 앱 일정은 'Brazilian Grand Prix' */
var DOTD_MEM={};

function dotdNorm(s){
  s=String(s==null?'':s);
  try{ s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  return s.toLowerCase().replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
}
function dotdKey(s){ return dotdNorm(s).replace(/grand prix/g,'').replace(/[^a-z0-9]/g,''); }
function dotdDist(a,b){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>2) return 9;
  var prev=[],cur=[],i,j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur=[i];
    for(j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    prev=cur;
  }
  return prev[b.length];
}
/* DOTD의 그랑프리 이름을 앱의 라운드로 맞춘다(이름 표기 차이·오타 보정) */
function dotdRoundFor(races,name){
  var k=dotdKey(name),i,rk,al=DOTD_ALIAS[k],best=null,d;
  if(!k || !races || !races.length) return 0;
  for(i=0;i<races.length;i++) if(dotdKey(races[i].name)===k) return races[i].round;
  for(i=0;i<races.length;i++){ rk=dotdKey(races[i].name); if(rk && (rk.indexOf(k)>=0 || k.indexOf(rk)>=0)) return races[i].round; }
  if(al) for(i=0;i<races.length;i++) if(dotdKey(races[i].name)===al) return races[i].round;
  for(i=0;i<races.length;i++){
    rk=dotdKey(races[i].name); d=dotdDist(rk,k);
    if(d<=2 && (!best || d<best[0])) best=[d,races[i].round];
  }
  return best?best[1]:0;
}
function dotdParse(json,races){
  var out={},list=(json&&json.races)||[],i,e,rd;
  for(i=0;i<list.length;i++){
    e=list[i];
    if(!e || !e.winner) continue;
    rd=dotdRoundFor(races,e.race_name);
    if(!rd) continue;
    out[String(rd)]={n:String(e.winner)};
  }
  return out;
}
/* 내장 값(드라이버 코드 포함)을 우선하고, 바뀐 수상자만 라이브 값으로 덮는다 */
function dotdMerge(emb,live){
  var out={},k;
  for(k in emb) if(Object.prototype.hasOwnProperty.call(emb,k)) out[k]=emb[k];
  for(k in live) if(Object.prototype.hasOwnProperty.call(live,k)){
    var a=out[k],b=live[k];
    if(a && a.c && b && dotdNorm(a.n)===dotdNorm(b.n)) continue;
    out[k]=b;
  }
  return out;
}
function dotdEmbed(year){
  var d=CACHE.dotd;
  return (d && d[String(year)]) || {};
}
function dotdFetch(year){
  return getRaces(year).then(function(races){
    return jget(DOTD_BASE+year+'/dotd_'+year+'.json').then(function(j){ return dotdParse(j,races); });
  });
}
function getDotdMap(year){
  if(DOTD_MEM[year]) return Promise.resolve(DOTD_MEM[year]);
  if(!(year>=DOTD_MIN)){ DOTD_MEM[year]={}; return Promise.resolve(DOTD_MEM[year]); }
  var emb=dotdEmbed(year),key='dotd:'+year,p;
  if(year===CACHE.year){
    var fresh=lsFresh(key,ttlFor(year));
    if(fresh && typeof fresh==='object' && !Array.isArray(fresh) && Object.keys(fresh).length){
      p=Promise.resolve(dotdMerge(emb,fresh));
    }else{
      p=Promise.resolve(emb);                 /* 내장 값으로 즉시 표시 */
      liveFetch(key,function(){ return dotdFetch(year); }).then(function(map){
        if(!map || typeof map!=='object' || Array.isArray(map) || !Object.keys(map).length) return;
        var merged=dotdMerge(emb,map),before=JSON.stringify(emb);
        CACHE.dotd=CACHE.dotd||{}; CACHE.dotd[String(year)]=merged;
        if(JSON.stringify(merged)!==before){ DOTD_MEM[year]=merged; quietRefresh(); }
      },function(){});
    }
  }else{
    p=memo(key,ttlFor(year),function(){ return dotdFetch(year); }).then(function(map){
      var live=(map && typeof map==='object' && !Array.isArray(map))?map:{};
      var merged=dotdMerge(emb,live);
      return Object.keys(merged).length?merged:emb;
    },function(){ return emb; });
  }
  return p.then(function(map){ DOTD_MEM[year]=map||{}; return DOTD_MEM[year]; });
}
/* 해당 레이스 결과 행 중 DOTD 수상자의 인덱스(코드 우선, 없으면 이름 대조) */
function dotdWinnerIndex(rows,entry){
  var i,toks,fam;
  if(!entry || !rows || !rows.length) return -1;
  if(entry.c) for(i=0;i<rows.length;i++) if(rows[i].code===entry.c) return i;
  if(!entry.n) return -1;
  toks=dotdNorm(entry.n).split(' ');
  for(i=0;i<rows.length;i++) if(rows[i].full && dotdNorm(rows[i].full)===dotdNorm(entry.n)) return i;
  for(i=0;i<rows.length;i++){
    fam=dotdNorm(rows[i].name);
    if(fam && toks.indexOf(fam)>=0) return i;
  }
  return -1;
}

/* OpenF1 */
function getOF1(year){
  var s=seasonObj(year);
  if(s.of1) return Promise.resolve(s.of1);
  var p;
  if(year===CACHE.year){
    var emb=(CACHE.of1Sessions && CACHE.of1Sessions.length)?CACHE.of1Sessions:[];
    var key='of1:'+year;
    var live=function(){
      return liveFetch(key,function(){
        return jget(OF1+'/sessions?year='+year).then(function(d){return Array.isArray(d)?d:[];});
      });
    };
    var fresh=lsFresh(key,ttlFor(year));
    if(fresh && fresh.length){ p=Promise.resolve(fresh); }
    else if(syncForced()){
      p=live().then(function(list){ return (list&&list.length)?list:emb; },function(){ return emb; });
    } else {
      p=Promise.resolve(emb);
      var before=sigOf1(emb);
      live().then(function(list){
        if(!list || !list.length) return;
        CACHE.of1Sessions=list; s.of1=null;
        if(sigOf1(list)!==before) quietRefresh();
      },function(){});
    }
  } else if(year<2023){
    p=Promise.resolve([]);
  } else {
    p=memo('of1:'+year,ttlFor(year),function(){
      return jget(OF1+'/sessions?year='+year).then(function(d){return Array.isArray(d)?d:[];});
    });
  }
  return p.then(function(list){
    s.of1=list.map(function(x){
      return {key:x.session_key,name:x.session_name,type:x.session_type,meeting:x.meeting_key,
        start:x.date_start,end:x.date_end,cancelled:x.is_cancelled};
    });
    return s.of1;
  });
}
function meetingForRace(of1,race){
  var raceTS=Date.parse((race.date||'')+'T'+((race.time||'00:00:00Z').replace(/^(\d{2}:\d{2}:\d{2})$/, '$1Z')));
  if(isNaN(raceTS)) raceTS=Date.parse(race.date+'T23:59:59Z');
  var groups={},k,s;
  for(var i=0;i<of1.length;i++){
    s=of1[i];
    if(s.cancelled) continue;
    if(/^Day \d$/.test(s.name||'')) continue;
    (groups[s.meeting]||(groups[s.meeting]=[])).push(s);
  }
  var best=null,bestDiff=Infinity;
  for(k in groups){
    if(!Object.prototype.hasOwnProperty.call(groups,k)) continue;
    var ss=groups[k],min=Infinity,max=-Infinity;
    for(var j=0;j<ss.length;j++){
      var t=Date.parse(ss[j].start);
      if(isNaN(t)) continue;
      if(t<min) min=t;
      if(t>max) max=t;
    }
    if(min===Infinity) continue;
    if(raceTS>=min-8*3600e3 && raceTS<=max+8*3600e3){
      var diff=Math.abs(raceTS-max);
      if(diff<bestDiff){ bestDiff=diff; best=k; }
    }
  }
  return best;
}
function of1SessionByKind(of1,race,kind){
  if(!of1 || !of1.length) return null;
  var mk=meetingForRace(of1,race);
  if(mk==null) return null;
  var want= kind==='fp1'?'Practice 1':kind==='fp2'?'Practice 2':kind==='fp3'?'Practice 3':
             kind==='sprint'?'Sprint':kind==='quali'?'Qualifying':kind==='race'?'Race':null;
  var list=of1.filter(function(s){return String(s.meeting)===String(mk) && !s.cancelled;}),i,n;
  for(i=0;i<list.length;i++){
    n=list[i].name||'';
    if(kind==='sq'){ if(/Sprint Qualifying|Sprint Shootout/i.test(n)) return list[i]; }
    else if(want && n===want) return list[i];
  }
  return null;
}
/* Jolpica에 세션 시각이 없을 때 OpenF1 sessions의 date_start를 fallback으로 */
function of1SessionStart(race,kind){

function sessionStartFor(race,kind){

function of1SessionResult(sessionKey,meetingKey){

        full:drvFullName(d)||acr,teamId:teamIdByName(d.team_name||d.team||''),team:d.team_name||'',
        color:TEAM_COLOR[teamIdByName(d.team_name||d.team||'')]||(d.team_colour?('#'+String(d.team_colour).replace('#','')):null),
        time:Array.isArray(r.duration)?null:(r.duration==null?null:r.duration),
        segs:Array.isArray(r.duration)?r.duration:null,
        gap:Array.isArray(r.gap_to_leader)?r.gap_to_leader[r.gap_to_leader.length-1]:r.gap_to_leader,

/* 진행 상태 / 완료 라운드 */
function isDone(race){ return race.date <= CURRENT_TODAY; }
function lastDoneRound(races){
  var out=null;
  for(var i=0;i<races.length;i++){ if(isDone(races[i])) out=races[i].round; }
  return out||races[0].round;
}
function peekWinner(year,round){
  var s=SEASONS[year];
  if(year===CACHE.year && CACHE.results[String(round)]){
    var r0=CACHE.results[String(round)][0];
    if(r0) return {code:(r0.Driver||{}).code||'',teamId:(r0.Constructor||{}).constructorId||''};
  }
  if(s && s.all.race && s.all.race[String(round)]){
    var r1=s.all.race[String(round)][0];
    if(r1) return {code:(r1.Driver||{}).code||'',teamId:(r1.Constructor||{}).constructorId||''};
  }
  if(s && s.rounds['race:'+round]){
    var r2=s.rounds['race:'+round][0];
    if(r2) return {code:(r2.Driver||{}).code||'',teamId:(r2.Constructor||{}).constructorId||''};
  }
  return null;
}

  return '<div class="card"><div class="note'+(cls?' '+cls:'')+'"><b>'+esc(title)+'</b>'+esc(body)+(btns||'')+'</div></div>';
}
function driverCell(code,name,teamId,extra){
  return '<div class="drv"><span class="bar" style="background:'+teamColor(teamId)+'"></span>'+
    '<div style="min-width:0"><div class="code">'+esc(code||'—')+(extra||'')+'</div>'+
    '<div class="ln">'+esc(name||'')+'</div></div></div>';
}
function posCell(row){
  var cls=row.pos===1?'p1':row.pos===2?'p2':row.pos===3?'p3':'';
  var txt=row.pos?String(row.pos):esc(row.posText||'-');
  return {cls:cls,txt:txt};
}
/* 결과 상태 표기: 완주는 기록/+N Lap, 불참은 DNS, 실격 DSQ, 나머지 리타이어는 DNF */
function raceStatusText(row,winLaps){
  var st=String(row.status||''),sl=st.toLowerCase(),pt=String(row.posText||'').toUpperCase(),n;
  if(pt==='W'||pt==='F'||sl==='did not start'||sl==='withdrew'||sl==='dns') return 'DNS';
  if(pt==='D'||sl==='disqualified') return 'DSQ';
  if(row.time) return row.time;                        /* 완주 기록·갭(+N.NNN) */
  if(pt==='R') return 'DNF';
  if(sl==='lapped'||/^\+\d+\s*laps?$/.test(sl)){
    n=(winLaps&&row.laps)?(+winLaps)-(+row.laps):0;
    return n>0?('+'+n+' Lap'+(n>1?'s':'')):'—';
  }
  if(sl==='finished'||sl==='') return '—';
  return 'DNF';
}
function statusAbbr(st,posText){
  var s=String(st||'').toLowerCase(),p=String(posText||'').toUpperCase();
  if(p==='W'||p==='F'||s==='did not start'||s==='withdrew'||s==='dns') return 'DNS';
  if(p==='D'||s==='disqualified') return 'DSQ';
  if(s===''||s==='finished'||s==='lapped') return '';
  return 'DNF';
}

/* ============================ 렌더: 레이스 ============================ */
var CARET_SVG='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
function sessionTabs(race){
  if(race.sprint) return [['fp1','FP1'],['sq','SQ'],['sprint','스프린트'],['quali','퀄리파잉'],['grid','그리드'],['race','레이스']];
  return [['fp1','FP1'],['fp2','FP2'],['fp3','FP3'],['quali','퀄리파잉'],['grid','그리드'],['race','레이스']];
}
/* ---------- 직전 연도 동일 그랑프리 ---------- */
function normRaceName(n){
  return String(n||'').toLowerCase().replace(/grand\s*prix|그랑프리/g,'').replace(/[^a-z0-9가-힣]/g,'');
}
/* 직전 연도(year-1) 일정에서 같은 서킷(또는 같은 그랑프리명) 경기를 찾아 그 경기 객체를 돌려준다. 없으면 null */
function prevGpRace(year){
  var y=year-1;
  if(y<YEARS[YEARS.length-1]) return Promise.resolve(null);
  return Promise.all([getRaces(year),getRaces(y)]).then(function(res){
    var cur=null,i,list=res[0]||[],prev=res[1]||[];
    for(i=0;i<list.length;i++) if(+list[i].round===+S.round) cur=list[i];
    if(!cur) return null;
    var cid=cur.circuitId||'';
    if(cid){
      for(i=0;i<prev.length;i++) if((prev[i].circuitId||'')===cid && isDone(prev[i])) return prev[i];
    }
    var cn=normRaceName(cur.name);
    if(cn){
      for(i=0;i<prev.length;i++) if(normRaceName(prev[i].name)===cn && isDone(prev[i])) return prev[i];
    }
    return null;
  }).catch(function(){ return null; });
}
function prevGpRound(year){
  return prevGpRace(year).then(function(r){ return r?r.round:null; });
}
/* 이동할 경기의 주말 형식에 세션이 있으면 그대로 유지하고, 없을 때만 레이스로 폴다운 */
function sessionFor(race,sess){
  var tabs=sessionTabs(race),i;
  for(i=0;i<tabs.length;i++) if(tabs[i][0]===sess) return sess;
  return 'race';
}
/* 결과 카드 헤더: 제목 바로 오른쪽에 붙는 '‹ {직전연도}' 복귀 버튼(복귀 스택이 비어 있지 않을 때만) */
function backBtn(){

  var st=BACK[BACK.length-1];

/* 결과 카드 상단 제목 옆에 '2025 결과 ›' 배지 삽입(매칭되는 직전 연도 경기가 있을 때만)
   복귀 버튼이 함께 뜨면 '2025 ›'로 줄여 375px에서도 한 줄에 들어가게 한다 */

function renderRace(){

/* 헤더 날짜: Jolpica에 그 세션 시각이 없을 때만 OpenF1에서 채워 넣는다(화면 전환되면 버린다) */
function enrichHeaderDate(race){
  if(sessionISOFromRace(race,S.session)) return;
  var rnd=String(+race.round),kind=S.session;
  sessionStartFor(race,kind).then(function(iso){
    if(!iso) return;

    if(el.getAttribute('data-round')!==rnd || el.getAttribute('data-sess')!==kind) return;
    el.textContent=race.circuit+' · '+fmtKSTDate(iso);
  }).catch(function(){});
}

/* ---------- 그랑프리 빠른 선택(원클릭 점프) 바텀시트 ---------- */
var GPSHEET=null;
function gpSheetKey(e){ if(e.key==='Escape') closeGpSheet(); }
function closeGpSheet(){
  var el=GPSHEET;
  if(!el) return;
  GPSHEET=null;
  if(el.parentNode) el.parentNode.removeChild(el);
  document.body.style.overflow='';
  window.removeEventListener('keydown',gpSheetKey);
}
function openGpSheet(){
  closeGpSheet();
  var wrap=document.createElement('div');
  wrap.className='sheetwrap';
  wrap.id='gpSheet';
  wrap.innerHTML='<div class="sheetbg" data-act="gpClose"></div>'+
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="그랑프리 선택">'+
      '<div class="sheet-hd"><div class="t"><b>'+S.year+' 시즌 그랑프리</b>'+
      '<span id="gpSheetSub">불러오는 중…</span></div>'+
      '<button class="sheet-x" data-act="gpClose" aria-label="닫기">✕</button></div>'+
      '<div class="sheet-list" id="gpSheetList">'+skeleton(6)+'</div>'+
    '</div>';
  document.body.appendChild(wrap);
  document.body.style.overflow='hidden';
  GPSHEET=wrap;
  window.addEventListener('keydown',gpSheetKey);
  getRaces(S.year).then(function(races){
    if(GPSHEET!==wrap) return;
    var list=document.getElementById('gpSheetList');
    if(!list) return;
    var rows='',i,done=0;
    for(i=0;i<races.length;i++){
      var r=races[i],dn=isDone(r),cur=r.round===S.round;
      if(dn) done++;
      rows+='<button class="gpi'+(cur?' on':'')+'" data-act="gpGo" data-round="'+r.round+'">'+
        '<span class="rn2">R'+r.round+'</span>'+
        '<span class="mn"><span class="nm2"><span class="g">'+esc(gpKo(r))+'</span>'+
          (r.sprint?'<i class="badge sp">SPRINT</i>':'')+(cur?'<i class="badge cur">현재</i>':'')+'</span>'+
        '<span class="sb">'+esc(fmtDate(r.date))+' · '+esc(r.circuit)+'</span></span>'+
        '<span class="st2">'+(dn?'<i class="badge done">완료</i>':'<i class="badge up">예정</i>')+'</span></button>';
    }

    var curEl=list.querySelector('.gpi.on');

      var cr=curEl.getBoundingClientRect(),lr=list.getBoundingClientRect();
      list.scrollTop+=(cr.top-lr.top)-(lr.height/2-cr.height/2);

    var list=document.getElementById('gpSheetList');
    if(list && GPSHEET===wrap) list.innerHTML='<div class="note"><b>목록을 불러오지 못했습니다</b>'+esc(e.message||String(e))+'</div>';
  });
}

function loadSession(race){
  var body=document.getElementById('sessBody');
  if(!body) return Promise.resolve();
  var kind=S.session;
  return new Promise(function(resolve){
    var task;
    if(kind==='grid'){ task=loadGrid(race); }
    else if(kind==='race'||kind==='quali'||kind==='sprint'){ task=loadJolpicaSession(race,kind); }
    else { task=loadOf1Session(race,kind); }
    task.then(function(data){
      if(!document.body.contains(body)) return resolve();
      body.innerHTML=sessionTable(data,race);
      if(data.pre && data.startISO) startCountdown(data.startISO); else stopCountdown();
      fillPrevBadge();
      resolve();
    }).catch(function(e){
      if(document.body.contains(body)) body.innerHTML=errBox(e.message||String(e));
      resolve();
    });
  });
}

/* ---------- 시작 전 안내 카드 + 실시간 카운트다운 ---------- */
var CD_TIMER=null;
function stopCountdown(){ if(CD_TIMER){ clearInterval(CD_TIMER); CD_TIMER=null; } }
function cdLeftText(ms){
  var s=Math.floor(ms/1000);
  var d=Math.floor(s/86400),hh=Math.floor((s%86400)/3600),mm=Math.floor((s%3600)/60),ss=s%60;
  var out=(d>0?d+'일 ':'')+pad2(hh)+'시간 '+pad2(mm)+'분 '+pad2(ss)+'초 남음';
  return out;
}
function startCountdown(startISO){
  stopCountdown();
  var target=Date.parse(startISO);
  if(isNaN(target)) return;
  var tick=function(){
    var el=document.getElementById('cdv');
    if(!el){ stopCountdown(); return; }        /* 화면이 바뀌면 타이머 정리 */
    var left=target-Date.now();
    if(left<=0){ el.textContent='지금 시작'; stopCountdown(); return; }
    el.textContent='시작까지 '+cdLeftText(left);
  };
  tick();
  CD_TIMER=setInterval(tick,1000);
}
function preSessionData(kind,iso){ return {kind:kind,rows:[],pre:true,startISO:iso,label:sessionLabel(kind)}; }

function loadJolpicaSession(race,kind){
  return sessionStartFor(race,kind).then(function(startISO){
    /* 시작 전이면 결과 API를 부르지 않고 바로 안내 카드 */
    if(startISO && Date.parse(startISO)>Date.now()) return preSessionData(kind,startISO);
    var rowsTask=getRoundRows(S.year,race.round,kind);
    if(kind!=='race') return rowsTask.then(function(rows){ return {kind:kind,rows:rows}; });
    return Promise.all([rowsTask,getDotdMap(S.year).catch(function(){ return {}; })]).then(function(res){
      var map=res[1]||{};
      return {kind:kind,rows:res[0],dotd:map[String(race.round)]||null};
    });
  });
}
/* 2026 라스베이거스 GP FP1: 우천으로 플라잉 랩 없이 종료되어 공식 랩타임이 비어 있는 경우의 안내 */
var VEGAS_FP1_TITLE='FP1 공식 기록 없음 (No times set)';
var VEGAS_FP1_NOTE='우천으로 노면이 젖어 드라이버들이 점검 주행만 소화하고 플라잉 랩을 달리지 않아, 공식 랩타임이 기록되지 않았습니다.';
function isVegasFp1NoTimes(race,kind,sess){
  if(S.year!==2026 || kind!=='fp1') return false;
  if(sess && String(sess.key)==='11413') return true;
  return /las\s*vegas/i.test((race.circuit||'')+' '+(race.name||''));
}
function isNoResultErr(e){
  if(e && e.status===404) return true;
  return /No results found/i.test(String((e&&e.detail)||(e&&e.message)||e||''));
}
function vegasFp1Data(kind){
  return {kind:kind,rows:[],title:VEGAS_FP1_TITLE,note:VEGAS_FP1_NOTE,keepall:true};
}
function loadOf1Session(race,kind){
  var fromRace=sessionISOFromRace(race,kind);
  if(fromRace && Date.parse(fromRace)>Date.now()) return Promise.resolve(preSessionData(kind,fromRace));
  return getOF1(S.year).then(function(of1){
    if(!of1.length){
      return {kind:kind,rows:[],note: S.year<2023
        ? '연습주행·스프린트 슈팅 기록은 2023 시즌부터 제공됩니다. (퀄리파잉·레이스 결과는 위 탭에서 확인)'
        : '이 시즌의 세션 정보가 없습니다.'};
    }
    var mk=meetingForRace(of1,race);
    if(mk==null) return {kind:kind,rows:[],note:'이 그랑프리의 세션 정보를 찾지 못했습니다.'};
    var list=of1.filter(function(s){return String(s.meeting)===String(mk) && !s.cancelled;});
    var want= kind==='fp1'?'Practice 1':kind==='fp2'?'Practice 2':kind==='fp3'?'Practice 3':null;
    var sess=null,i;
    if(want){ for(i=0;i<list.length;i++) if(list[i].name===want) sess=list[i]; }
    else { for(i=0;i<list.length;i++) if(/Sprint Qualifying|Sprint Shootout/i.test(list[i].name||'')) sess=list[i]; }
    if(!sess) return {kind:kind,rows:[],note: isDone(race)
      ? '이 주말에는 해당 세션이 없습니다. (스프린트 주말은 FP1·SQ·스프린트·Q·레이스)'
      : '아직 진행되지 않은 세션입니다.'};
    var st=normISO(sess.start),en=normISO(sess.end);
    /* 시작 시각이 미래면 session_result를 호출하지 않고 시작 전 카드 */
    if(st && Date.parse(st)>Date.now()) return preSessionData(kind,st);
    var live=function(){ return !!(st && en && Date.now()<Date.parse(en)); };
    return of1SessionResult(sess.key,mk).then(function(rows){
      if(!rows.length && live()) return {kind:kind,rows:[],inprog:true,label:sessionLabel(kind),startISO:st};
      if(!rows.length && isVegasFp1NoTimes(race,kind,sess)) return vegasFp1Data(kind);
      return {kind:kind,rows:rows,session:sess};
    },function(e){
      if(live()) return {kind:kind,rows:[],inprog:true,label:sessionLabel(kind),startISO:st};
      /* OpenF1이 결과 없음(404)을 돌려주는 경우도 빈 결과로 보고 같은 안내 */
      if(isNoResultErr(e) && isVegasFp1NoTimes(race,kind,sess)) return vegasFp1Data(kind);
      throw e;
    });
  });
}

/* ---------- 스타팅 그리드 ---------- */
function loadGrid(race){
  var tasks=[getRoundRows(S.year,race.round,'race'),getRoundRows(S.year,race.round,'quali')];
  if(race.sprint) tasks.push(getRoundRows(S.year,race.round,'sprint'));
  else tasks.push(Promise.resolve([]));
  var sqTask = race.sprint ? sqPosMap(race) : Promise.resolve({});
  return Promise.all(tasks.concat([sqTask])).then(function(res){
    var raceRows=res[0],qRows=res[1],spRows=res[2],sqMap=res[3]||{};
    var qMap={};
    qRows.forEach(function(r){ qMap[r.driverId]=r.pos; });
    var provisional=false,base=raceRows;
    if(!raceRows.length && qRows.length){
      provisional=true;
      base=qRows.map(function(r,i){
        return {pos:0,posText:'-',driverId:r.driverId,code:r.code,name:r.name,teamId:r.teamId,
          team:r.team,grid:String(i+1),status:'',flrank:0};
      });
    }
    GRID.data={race:base,quali:qMap,sprint:spRows,sq:sqMap,provisional:provisional};
    GRID.race=race;
    return {kind:'grid'};
  });
}
function sqPosMap(race){
  return getOF1(S.year).then(function(of1){
    var mk=meetingForRace(of1,race);
    if(mk==null) return {};
    var s=null;
    for(var i=0;i<of1.length;i++){
      if(String(of1[i].meeting)===String(mk) && /Sprint Qualifying|Sprint Shootout/i.test(of1[i].name||'')) { s=of1[i]; break; }
    }
    if(!s) return {};
    return of1SessionResult(s.key,mk).then(function(rows){
      var m={}; rows.forEach(function(r){ m[r.code]=r.pos; }); return m;
    });
  }).catch(function(){ return {}; });
}
function gridSorted(rows){
  var idx=rows.map(function(r,i){return {r:r,i:i};});
  var num=idx.filter(function(x){return +x.r.grid>0;}).sort(function(a,b){return (+a.r.grid)-(+b.r.grid)||a.i-b.i;});
  var pit=idx.filter(function(x){return !(+x.r.grid>0);}).sort(function(a,b){return a.i-b.i;});
  return num.concat(pit);
}
function deltaHtml(fromPos,toPos){
  if(!fromPos||!toPos) return '<span class="delta eq">—</span>';
  var d=fromPos-toPos;
  if(d>0) return '<span class="delta up">▲'+d+'</span>';
  if(d<0) return '<span class="delta dn">▼'+Math.abs(d)+'</span>';
  return '<span class="delta eq">–</span>';
}
/* 2026 시즌 라스베이거스 GP(21R) 레이스 스타팅 그리드 한정: 그리드 페널티 사유 */
var GRID_REASONS={
  '2026-21-race':{
    ANT:{badge:'▼5 그리드 강등',q:1,grid:6,
      reason:'파워유닛 내연기관(ICE) 6호기 교체 규정 위반으로 5그리드 페널티가 적용되었습니다.'},
    PIA:{badge:'▼10 그리드 강등',q:7,grid:17,
      reason:'파워유닛 내연기관(ICE) 5호기 교체(시즌 허용량 최초 초과)로 10그리드 페널티가 적용되었습니다.'},

/* 해당 연도·라운드·레이스 그리드일 때만 사유 맵을 돌려준다(다른 그랑프리·스프린트 그리드는 영향 없음) */
function gridReasonMap(race,mode){
  if(!(S.year===2026 && race && +race.round===21 && mode==='race')) return null;
  return GRID_REASONS['2026-21-race']||null;
}
/* 행 바로 아래 펼쳐지는 아코디언(1번 안): 한 번에 하나만 열린다 */
var GRIDOPEN=null;
function closeGridReasonAcc(){
  var op=document.querySelector('table.tbl tr.gropen');
  while(op){
    if(op.getAttribute('aria-expanded')==='true') op.setAttribute('aria-expanded','false');
    op.classList.remove('gropen');
    op=document.querySelector('table.tbl tr.gropen');
  }
  var ex=document.querySelector('table.tbl tr.grid-reason-row');
  while(ex){ if(ex.parentNode) ex.parentNode.removeChild(ex); ex=document.querySelector('table.tbl tr.grid-reason-row'); }
  GRIDOPEN=null;
}
function toggleGridReason(tr){
  if(!tr) return;
  var code=tr.getAttribute('data-code')||'';
  var map=gridReasonMap(GRID.race||{},'race'),rs=map?map[code]:null;
  if(!rs) return;
  var wasOpen=(GRIDOPEN===code && tr.classList.contains('gropen'));
  closeGridReasonAcc();
  if(wasOpen) return;
  var row=document.createElement('tr');
  row.className='grid-reason-row';
  row.innerHTML='<td colspan="5" style="text-align:left;padding:2px 10px 10px 44px;border-top:none;background:rgba(255,107,98,0.05)">'+
      '<div class="gracc">'+
        '<div class="grl1"><span class="grb">'+esc(rs.badge)+'</span>'+
        '<span class="grp">'+esc('퀄리파잉 '+rs.q+'위 → 출발 '+rs.grid+'번 그리드')+'</span></div>'+
        '<div class="grr">'+esc(rs.reason)+'</div>'+
        '<div class="grsrc">출처: FIA 공식 스튜어드 발표</div>'+
      '</div></td>';
  if(!tr.parentNode) return;
  tr.parentNode.insertBefore(row,tr.nextSibling);
  tr.classList.add('gropen');
  if(tr.getAttribute('aria-expanded')==='false') tr.setAttribute('aria-expanded','true');
  GRIDOPEN=code;
}

function gridTable(){

function sessionTable(data,race){
  var kind=data.kind,rows=data.rows||[];
  if(kind==='grid') return gridTable();
  if(data.pre) return preSessionCard(data);
  if(!rows.length){
    if(data.inprog) return noteBox(data.label+' 진행 중','세션이 끝나면 결과가 표시됩니다.');
    return noteBox(data.title||(sessionLabel(kind)+' 기록 없음'), data.note||'표시할 결과가 없습니다.', '', data.keepall?'keepall':'');
  }
  if(kind==='quali') return qualiTable(rows,race);
  if(kind==='race') return raceTable(rows,race,'레이스',data.dotd);
  if(kind==='sprint') return raceTable(rows,race,'스프린트');
  if(kind==='sq') return sqTable(rows,race);
  return practiceTable(rows,race,data.session);
}

/* ============================ 렌더: 일정 ============================ */
/* 원본 결과 행 → 포디움 1·2·3위 [{pos,code,teamId}] */
function podiumOf(rows){
  if(!rows || !rows.length) return null;
  var out=[],i,r,d,c,p;
  for(i=0;i<rows.length;i++){
    r=rows[i];d=r.Driver||{};c=r.Constructor||{};
    p=num(r.position);
    if(!(p>=1 && p<=3)) continue;
    out.push({pos:p,code:(d.code||String(d.familyName||'').slice(0,3).toUpperCase()||''),teamId:c.constructorId||''});
  }
  if(!out.length){
    for(i=0;i<rows.length && i<3;i++){
      r=rows[i];d=r.Driver||{};c=r.Constructor||{};
      out.push({pos:i+1,code:(d.code||String(d.familyName||'').slice(0,3).toUpperCase()||''),teamId:c.constructorId||''});
    }
  }
  out.sort(function(a,b){return a.pos-b.pos;});
  return out.length?out.slice(0,3):null;
}
/* 동기적으로 볼 수 있는 값만으로 포디움을 찾는다(내장 캐시 → 시즌 맵 → 라운드 캐시) */
function peekPodium(year,round){
  var s=SEASONS[year],pod=null;
  if(year===CACHE.year && CACHE.results && CACHE.results[String(round)]) pod=podiumOf(CACHE.results[String(round)]);
  if(!pod && s && s.all && s.all.race && s.all.race[String(round)]) pod=podiumOf(s.all.race[String(round)]);
  if(!pod && s && s.rounds && s.rounds['race:'+round]) pod=podiumOf(s.rounds['race:'+round]);
  return pod;
}
/* 오른쪽 영역: 가로 1줄 둥근 포디움 배지 3개 */
function winCell(pod){
  if(!pod || !pod.length) return '<span class="chev">›</span>';
  var h='<span class="pd">';
  for(var i=0;i<pod.length;i++){
    var p=pod[i];
    h+='<span class="pdb"><span class="pn">'+p.pos+'</span>'+
       '<span class="pb" style="background:'+teamColor(p.teamId)+'"></span>'+
       '<span class="pc">'+esc(p.code)+'</span></span>';
  }
  return h+'</span>';
}
/* 연도와 상관없이 끝난 그랑프리의 1·2·3위를 일정 목록에 채운다(시즌 맵은 한 번만 불러온다) */
function fillScheduleWinners(){
  var year=S.year,s=SEASONS[year],i,pod;
  if(!s || !s.races) return;
  var pending=0;
  for(i=0;i<s.races.length;i++){
    if(!isDone(s.races[i])) continue;
    pod=peekPodium(year,s.races[i].round);
    if(!pod || pod.length<3) pending++;
  }
  if(!pending) return;
  getSeasonMap(year,'race').then(function(){
    if(S.year!==year || S.view!=='schedule') return;
    var nodes=MAIN.querySelectorAll('[data-win]');
    for(i=0;i<nodes.length;i++) nodes[i].innerHTML=winCell(peekPodium(year,+nodes[i].getAttribute('data-win')));
  }).catch(function(){});
}
function renderSchedule(){
  MAIN.innerHTML=skeleton(5);
  return getRaces(S.year).then(function(races){
    var rows='',i;
    for(i=0;i<races.length;i++){
      var r=races[i],done=isDone(r),pod=done?peekPodium(S.year,r.round):null;
      rows+='<button class="rowitem" data-act="openRace" data-round="'+r.round+'">'+
        '<span class="rn">'+r.round+'</span>'+
        '<span class="ri-main"><span class="ri-top">'+esc(gpKo(r))+
          (r.sprint?' <i class="badge sp">SPRINT</i>':'')+(done?'':' <i class="badge up">예정</i>')+
        '</span><span class="ri-sub">'+fmtDate(r.date)+'</span></span>'+
        '<span class="ri-right" data-win="'+r.round+'">'+winCell(pod)+'</span></button>';
    }
    MAIN.innerHTML='<div class="secttl">'+S.year+' 시즌 <span class="dim">'+races.length+'개 그랑프리 · 완료 '+races.filter(isDone).length+'</span></div>'+
      '<div class="card list">'+rows+'</div>'+
      '<div class="footnote">데이터 · Jolpica F1 API / OpenF1 API<br>연습주행·스프린트 슈팅 기록은 2023 시즌부터 제공</div>';
    fillScheduleWinners();
  }).catch(function(e){ MAIN.innerHTML=errBox(e.message||String(e)); });
}

  }).catch(function(e){ MAIN.innerHTML=errBox(e.message||String(e)); });

/* ============================ 렌더: 검색 ============================ */
/* 드라이버 탭 서브탭: [드라이버 검색] / [1:1 비교] (순위 탭 .seg와 같은 디자인) */
function driverSeg(){
  var t=S.driverTab||'search';
  return '<div class="seg">'+
    '<button class="'+(t==='search'?'on':'')+'" data-act="driverTab" data-tab="search">드라이버 검색</button>'+
    '<button class="'+(t==='h2h'?'on':'')+'" data-act="driverTab" data-tab="h2h">1:1 비교</button></div>';
}
function renderSearch(){
  if(S.driverTab==='h2h') return renderH2H();
  MAIN.innerHTML=driverSeg()+skeleton(4);
  var prevRank={},curRank={},i;
  function sortSearchList(){
    /* 1순위 베르스타펜 · 2순위 직전 연도 순위 · 3순위(루키) 올해 순위 */
    SEARCH_LIST.sort(function(a,b){
      var at=a.driverId==='max_verstappen'?0:(prevRank[a.driverId]?1:2);
      var bt=b.driverId==='max_verstappen'?0:(prevRank[b.driverId]?1:2);
      if(at!==bt) return at-bt;
      var ar=at===1?prevRank[a.driverId]:(at===2?(curRank[a.driverId]||999):0);
      var br=bt===1?prevRank[b.driverId]:(bt===2?(curRank[b.driverId]||999):0);
      return ar-br;
    });
  }
  function chipHTML(){
    var out='',k,d;
    for(k=0;k<SEARCH_LIST.length;k++){
      d=SEARCH_LIST[k];
      out+='<button class="chip" data-act="openDriver" data-driver="'+esc(d.driverId)+'" data-code="'+esc(d.code)+'">'+
        '<span class="bar" style="background:'+teamColor(d.teamId)+'"></span>'+esc(d.code)+'</button>';
    }
    return out;
  }
  return getStandings(S.year).then(function(st){
    SEARCH_LIST=st.drivers.slice();
    for(i=0;i<SEARCH_LIST.length;i++) curRank[SEARCH_LIST[i].driverId]=SEARCH_LIST[i].pos||(i+1);
    sortSearchList();
    var chips=chipHTML();
    MAIN.innerHTML=driverSeg()+'<div class="secttl">드라이버 검색 <span class="dim">'+S.year+' 시즌 전체 성적</span></div>'+
      '<div class="searchbox"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
      '<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="노리스 · NOR · 베르스타펜 · 안토넬리" value=""></div>'+
      '<div class="chips">'+chips+'</div><div id="sres"></div>';
    /* 직전 연도 순위를 받아오면 칩 순서를 다시 정렬 (실패하면 올해 순위 유지) */
    getStandings(S.year-1).then(function(prev){
      if(!prev || !prev.drivers || !prev.drivers.length) return;
      var k,pd;
      for(k=0;k<prev.drivers.length;k++){
        pd=prev.drivers[k];
        if(pd && pd.driverId) prevRank[pd.driverId]=pd.pos||(k+1);
      }
      sortSearchList();
      var box=document.querySelector('#main .chips');
      if(!box) return;
      box.innerHTML=chipHTML();
      var q=document.getElementById('q');
      if(q && q.value) onSearchInput(q.value);
    },function(){});
  }).catch(function(e){ MAIN.innerHTML=errBox(e.message||String(e)); });
}
function normalizeQ(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
function matches(d,q){
  if(!q) return false;
  var ko=(DRV_KO[d.driverId]||[]).join('|');
  var kof=DRV_KO_FULL[d.driverId]||'';
  var hay=normalizeQ([d.code,d.driverId,d.full,d.name,d.given,kof,ko.replace(/\|/g,' ')].join(' '));
  return hay.indexOf(q)>=0;
}
function onSearchInput(val){
  var box=document.getElementById('sres');
  if(!box) return;
  var q=normalizeQ(val);
  if(!q){ box.innerHTML=''; return; }
  var hits=SEARCH_LIST.filter(function(d){return matches(d,q);});
  if(!hits.length){
    box.innerHTML='<div class="card"><div class="note"><b>검색 결과 없음</b>"'+esc(val)+'" 에 해당하는 드라이버가 없습니다.<br>영문 이니셜(NOR) 또는 한글 이름(노리스)으로 검색해 보세요.</div></div>';
    return;
  }
  var h='<div class="card">',i;
  for(i=0;i<hits.length;i++){
    var d=hits[i],pc=posCell(d);
    h+='<button class="rowitem" data-act="openDriver" data-driver="'+esc(d.driverId)+'" data-code="'+esc(d.code)+'">'+
      '<span class="rn">'+pc.txt+'</span>'+
      '<span class="ri-main"><span class="ri-top">'+
        '<span class="bar" style="background:'+teamColor(d.teamId)+';height:14px"></span>'+
        esc(d.code)+' <span style="font-weight:700">'+esc(DRV_KO_FULL[d.driverId]||d.full)+'</span></span>'+
      '<span class="ri-sub">'+esc(d.full)+' · '+esc(teamKo(d.teamId,d.team))+' · '+d.points+' pts</span></span>'+
      '<span class="chev">›</span></button>';
  }
  box.innerHTML=h+'</div>';
}

/* ============================ 렌더: 드라이버 상세 ============================ */
function renderDriver(){
  MAIN.innerHTML=skeleton(6);
  var year=S.year,did=S.driverId;
  return Promise.all([getStandings(year),getRaces(year),getSeasonMap(year,'race'),getSeasonMap(year,'quali'),getSeasonMap(year,'sprint')])
  .then(function(res){
    var st=res[0],races=res[1],raceMap=res[2],qualiMap=res[3],sprintMap=res[4];
    var d=null,i;
    for(i=0;i<st.drivers.length;i++) if(st.drivers[i].driverId===did) d=st.drivers[i];
    var racesDone=races.filter(isDone);
    var wins=0,podiums=0,poles=0,rows='',spWins=0,points=0,fls=0,lastTeamId='',lastTeam='';
    var fbDob='',fbNat='';          /* 순위데이터에 생년월일·국적이 없을 때 결과 데이터에서 보충 */
    var cells=[],part=0;            /* part: 그 시즌에 실제로 엔트리가 있었던 라운드 수(레이스 결과·예선·스프린트 중 하나라도 있으면 카운트 → DNS·DNF·DNQ·DSQ 포함) */
    for(i=0;i<races.length;i++){
      var r=races[i];
      if(!isDone(r)) continue;
      var rr=(raceMap[String(r.round)]||[]).filter(function(x){return (x.Driver||{}).driverId===did;})[0];
      var qq=(qualiMap[String(r.round)]||[]).filter(function(x){return (x.Driver||{}).driverId===did;})[0];
      var ss=(sprintMap[String(r.round)]||[]).filter(function(x){return (x.Driver||{}).driverId===did;})[0];
      var rPos=rr?num(rr.position):0,rPts=rr?num(rr.points):0;
      var sPos=ss?num(ss.position):0,sPts=ss?num(ss.points):0,sGrid=ss?num(ss.grid):0;
      var qPos=qq?num(qq.position):0;
      if(rr&&rr.Constructor&&rr.Constructor.constructorId){ lastTeamId=rr.Constructor.constructorId; lastTeam=rr.Constructor.name||''; }
      if(rr&&!fbDob&&rr.dob) fbDob=rr.dob;
      if(rr&&!fbNat&&rr.nat) fbNat=rr.nat;
      if(rPos===1) wins++;
      if(rPos>=1&&rPos<=3) podiums++;
      if(sPos===1) spWins++;
      if(qPos===1) poles++;
      /* 패스티스트 랩: 레이스 결과 표의 보라색 FL 배지와 같은 기준(FastestLap.rank === 1) */
      if(rr && num(rr.FastestLap&&rr.FastestLap.rank)===1) fls++;
      points+=rPts+sPts;
      if(rr||qq||ss) part++;
      cells.push({round:r.round,race:r,rPos:rPos,rPts:rPts,qPos:qPos,sPos:sPos,sPts:sPts,sGrid:sGrid,hasSprint:!!ss,status:rr?rr.status:'',posText:rr?rr.positionText:'',sStatus:ss?ss.status:'',sPosText:ss?ss.positionText:''});
    }
    // 그 연도에 출전 기록이 없으면(대뷔 전 시즌 등) 최신 경기로 올리지 않고 상세 화면 안에서 안내만 보여준다
    if(!races.length){
      MAIN.innerHTML='<button class="back" data-act="nav" data-view="search">‹ 검색으로</button>'+
        errBox(S.year+' 시즌 경기 데이터를 불러오지 못했습니다.');
      return Promise.resolve();
    }
    if(!d && !part){
      var nmKo=DRV_KO_FULL[did]||S.driverCode||did;
      MAIN.innerHTML='<button class="back" data-act="nav" data-view="search">‹ 검색으로</button>'+
        '<div class="card"><div class="note"><b>'+S.year+' 시즌 출전 기록이 없습니다</b>'+esc(nmKo)+
        '<br>상단에서 다른 연도를 선택하거나 검색으로 돌아가세요.</div></div>';
      return Promise.resolve();
    }
    // 팀 보정
    var teamId=(d&&d.teamId)||lastTeamId,teamName=(d&&d.team)||lastTeam;
    var displayName=(d&&(DRV_KO_FULL[d.driverId]||d.full))||S.driverCode||did;
    var enName=(d&&d.full)||'';
    var pos=d?d.pos:'—',pts=d?d.points:points;
    /* 생년월일 · 국기 국적 (없는 항목은 빼고, 둘 다 없으면 줄 자체를 생략) */
    var dob=(d&&d.dob)||fbDob,nat=(d&&d.nationality)||fbNat,metaBits=[];
    if(dob) metaBits.push(fmtDob(dob));
    if(nat) metaBits.push(natKo(nat));
    var metaLine=metaBits.length?'<div class="db">'+esc(metaBits.join(' · '))+'</div>':'';
    var h='<button class="back" data-act="nav" data-view="search">‹ 검색으로</button>'+
      '<div class="card"><div class="dhd"><div class="acc" style="background:'+teamColor(teamId)+'"></div>'+
      '<div class="nm">'+esc(displayName)+'</div>'+
      '<div class="en">'+esc(enName)+' · '+esc((d&&d.code)||S.driverCode||'')+'</div>'+metaLine+
      '<div class="tm2"><span class="bar" style="background:'+teamColor(teamId)+';height:12px"></span>'+esc(teamKo(teamId,teamName))+' · '+S.year+' 시즌</div></div>'+
      '<div class="stats">'+
        '<div class="stat"><div class="v">'+esc(pos)+'</div><div class="k">순위</div></div>'+
        '<div class="stat"><div class="v">'+esc(pts)+'</div><div class="k">포인트</div></div>'+
        '<div class="stat"><div class="v">'+wins+'</div><div class="k">우승</div></div>'+
        '<div class="stat"><div class="v">'+podiums+'</div><div class="k">포디움</div></div>'+
      '</div>'+
      '<div class="stats" style="border-top:1px solid var(--line)">'+
        '<div class="stat"><div class="v">'+poles+'</div><div class="k">폴</div></div>'+
        '<div class="stat"><div class="v">'+spWins+'</div><div class="k">스프린트 우승</div></div>'+
        '<div class="stat"><div class="v">'+part+'</div><div class="k">출전 라운드</div></div>'+
        '<div class="stat"><div class="v">'+fls+'</div><div class="k">패스티스트 랩</div></div>'+
      '</div></div>';
    // 우승 & 폴 포지션: 좌우 2단 카드(숫자 표기 없음, 0회는 '-', 항상 렌더)
    var winList=[],poleList=[],wi;
    for(wi=0;wi<cells.length;wi++){
      if(cells[wi].rPos===1) winList.push(cells[wi]);
      if(cells[wi].qPos===1) poleList.push(cells[wi]);
    }
    function hlCol(titleCls,title,list,sess){
      var out='',k;
      for(k=0;k<list.length;k++){
        out+='<button class="hi" data-act="openRace" data-round="'+list[k].round+'" data-sess="'+sess+'">'+esc(gpKo(list[k].race))+'</button>';
      }
      return '<div class="hlc"><div class="hlt '+titleCls+'">'+title+'</div>'+(out||'<div class="hle">-</div>')+'</div>';
    }
    h+='<div class="card"><div class="hl">'+hlCol('p','⏱️ 폴 포지션',poleList,'quali')+hlCol('g','🏆 우승',winList,'race')+'</div></div>';
    // 라운드 테이블
    h+='<div class="card pad" style="margin-top:10px"><table class="tbl"><thead><tr>'+
      '<th>R</th><th class="d">그랑프리</th><th>Q</th><th>결과</th><th>PTS</th></tr></thead><tbody>';
    for(i=0;i<cells.length;i++){
      var c=cells[i];
      var ab=statusAbbr(c.status,c.posText);
      var rTxt=ab?ab:(c.rPos?String(c.rPos):'—');
      var cls=c.rPos===1?'p1':c.rPos===2?'p2':c.rPos===3?'p3':'';
      if(c.hasSprint){
        var sab=statusAbbr(c.sStatus,c.sPosText);
        var sTxt=sab?sab:(c.sPos?String(c.sPos):'—');
        /* 1행: 그랑프리 헤더(아래 밑줄) + 라운드 번호 rowspan 3 */
        h+='<tr class="'+cls+'"><td class="p rd" rowspan="3" style="vertical-align:middle;border-bottom:1px solid var(--line)">'+c.round+'</td>'+

          '<td class="d"><div style="font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:165px">'+esc(gpKo(c.race))+'</div>'+
          '<div class="ln">'+esc(fmtDate(c.race.date))+'</div></td>'+

    h+='</tbody></table></div>';
    h+='<div class="footnote">Q 예선/그리드 순위 · 스프린트/레이스 순위 · PTS 획득 포인트<br>'+S.year+' 시즌 완료 라운드 기준</div>';

/* ============================ 렌더: 드라이버 1:1 비교 ============================ */
function hexRgb(h){
  h=String(h||'').replace('#','');
  if(h.length===3) h=h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return [122,130,142];
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function rgbaHex(h,a){ var c=hexRgb(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
/* 같은 팀끼리 비교할 때 오른쪽 막대를 흰색 쪽으로 밝혀 구분한다 */
function mixHex(h,amt){
  var c=hexRgb(h),r=Math.round(c[0]+(255-c[0])*amt),g=Math.round(c[1]+(255-c[1])*amt),b=Math.round(c[2]+(255-c[2])*amt);
  return 'rgb('+r+','+g+','+b+')';
}
/* 레이스 한 라운드 비교: 0 = 왼쪽 우세, 1 = 오른쪽 우세, -1 = 비교 불가(동률·둘 다 미출전) */
function h2hRaceCmp(ra,rb){
  if(!ra||!rb) return -1;
  var fa=/^\d+$/.test(String(ra.positionText||'')),fb=/^\d+$/.test(String(rb.positionText||''));
  if(fa&&fb){
    var pa=num(ra.position),pb=num(rb.position);
    if(pa&&pb&&pa!==pb) return pa<pb?0:1;
    return -1;
  }
  /* 한쪽만 완주(분류)면 완주자가 앞, 둘 다 리타이어면 더 많은 랩을 돈 쪽이 앞 */
  if(fa) return 0;
  if(fb) return 1;
  var la=num(ra.laps),lb=num(rb.laps);
  if(la!==lb) return la>lb?0:1;
  return -1;
}
function h2hPosTxt(row){
  if(!row) return '—';
  var pt=String(row.positionText||'');
  if(/^\d+$/.test(pt)) return 'P'+pt;
  return statusAbbr(row.status,pt)||'—';
}
function h2hCell(txt,hi,col){
  if(hi) return '<span class="h2hpill" style="background:'+rgbaHex(col,.18)+';border:1px solid '+rgbaHex(col,.62)+'">'+esc(txt)+'</span>';
  return '<span class="h2hplain'+(/^(DNF|DNS|DSQ|—)$/.test(txt)?' dim':'')+'">'+esc(txt)+'</span>';
}
/* 시즌 맞대결 집계 + 라운드별 표 행 데이터 */
function h2hCompute(st,races,raceMap,qualiMap,aId,bId){
  var out={qA:0,qB:0,rA:0,rB:0,pA:0,pB:0,fA:0,fB:0,rows:[],done:0,a:null,b:null},i,j;
  for(i=0;i<st.drivers.length;i++){
    if(st.drivers[i].driverId===aId) out.a=st.drivers[i];
    if(st.drivers[i].driverId===bId) out.b=st.drivers[i];
  }
  for(i=0;i<races.length;i++){
    var r=races[i];
    if(!isDone(r)) continue;
    out.done++;
    var rows=raceMap[String(r.round)]||[],qrows=qualiMap[String(r.round)]||[];
    var ra=null,rb=null,qa=null,qb=null;
    for(j=0;j<rows.length;j++){
      var did=(rows[j].Driver||{}).driverId;
      if(did===aId) ra=rows[j]; else if(did===bId) rb=rows[j];
    }
    for(j=0;j<qrows.length;j++){
      var qid=(qrows[j].Driver||{}).driverId;
      if(qid===aId) qa=qrows[j]; else if(qid===bId) qb=qrows[j];
    }
    /* 퀄리파잉 맞대결: 두 선수 모두 예선 순위가 있는 라운드만 */
    var qaP=qa?num(qa.position):0,qbP=qb?num(qb.position):0;
    if(qaP>0&&qbP>0){ if(qaP<qbP) out.qA++; else if(qbP<qaP) out.qB++; }
    /* 레이스 맞대결 */
    if(ra&&rb){ var cmp=h2hRaceCmp(ra,rb); if(cmp===0) out.rA++; else if(cmp===1) out.rB++; }
    /* 포디움·패스티스트 랩 */
    if(ra){
      var pa=num(ra.position),fa=/^\d+$/.test(String(ra.positionText||''));
      if(fa&&pa>=1&&pa<=3) out.pA++;
      if(num(ra.FastestLap&&ra.FastestLap.rank)===1) out.fA++;
    }
    if(rb){
      var pb=num(rb.position),fb=/^\d+$/.test(String(rb.positionText||''));
      if(fb&&pb>=1&&pb<=3) out.pB++;
      if(num(rb.FastestLap&&rb.FastestLap.rank)===1) out.fB++;
    }
    out.rows.push({round:r.round,race:r,ra:ra,rb:rb,cmp:(ra&&rb)?h2hRaceCmp(ra,rb):-1});
  }
  return out;
}
function h2hPickCard(side,d,col){
  if(!d) return '<div class="h2hc"><span class="cd">—</span></div>';
  return '<button class="h2hc" data-act="h2hSheet" data-side="'+side+'" aria-label="'+(side==='a'?'왼쪽':'오른쪽')+' 드라이버 선택">'+
    '<span class="bar" style="background:'+col+'"></span>'+
    '<span class="cv">'+CARET_SVG+'</span>'+
    '<span class="cd">'+esc(d.code||'')+'</span>'+
    '<span class="nm">'+esc(d.full||'')+'</span>'+
    '<span class="tm" style="color:'+col+'">'+esc(teamKo(d.teamId,d.team))+'</span></button>';
}
function h2hScoreRow(label,va,vb,colA,colB){
  var tot=va+vb,pa=tot?Math.round(va/tot*100):50;
  var onA=tot?(va>=vb):false,onB=tot?(vb>va):false;
  var sz='font-size:16px';
  return '<div class="h2hrow"><div class="h2htop">'+
    '<span class="v" style="'+sz+';'+(onA?'color:#fff':'color:var(--dim)')+'">'+va+'</span>'+
    '<span class="lb">'+label+'</span>'+
    '<span class="v r" style="'+sz+';'+(onB?'color:#fff':'color:var(--dim)')+'">'+vb+'</span></div>'+
    '<div class="h2hbar">'+
      '<i style="width:'+pa+'%;background:'+(tot?colA:'#2A2F38')+'"></i>'+
      '<i style="width:'+(100-pa)+'%;background:'+(tot?colB:'#2A2F38')+'"></i>'+
    '</div></div>';
}
function renderH2H(){
  MAIN.innerHTML=driverSeg()+skeleton(6);
  return Promise.all([getStandings(S.year),getRaces(S.year),getSeasonMap(S.year,'race'),getSeasonMap(S.year,'quali')])
  .then(function(res){
    var st=res[0],races=res[1],raceMap=res[2],qualiMap=res[3];
    var list=st.drivers||[],ids={},i;
    for(i=0;i<list.length;i++) ids[list[i].driverId]=1;
    if(!list.length) throw new Error(S.year+' 시즌 드라이버 데이터가 없습니다.');
    var defA=list[0].driverId,defB=list[1]?list[1].driverId:defA;
    if(!S.h2hA||!ids[S.h2hA]) S.h2hA=defA;
    if(!S.h2hB||!ids[S.h2hB]) S.h2hB=defB;
    if(S.h2hA===S.h2hB&&list.length>1) for(i=0;i<list.length;i++) if(list[i].driverId!==S.h2hA){ S.h2hB=list[i].driverId; break; }
    var c=h2hCompute(st,races,raceMap,qualiMap,S.h2hA,S.h2hB);
    var A=c.a,B=c.b;
    if(!A||!B){
      MAIN.innerHTML=driverSeg()+'<div class="card"><div class="note"><b>드라이버를 불러오지 못했습니다</b>'+S.year+' 시즌 드라이버를 다시 선택해 주세요.</div></div>';
      return;
    }
    var colA=teamColor(A.teamId),colB=teamColor(B.teamId);
    var sameTeam=!!(A.teamId&&B.teamId&&A.teamId===B.teamId);
    var colBbar=sameTeam?mixHex(colB,.45):colB;
    var h=driverSeg();
    /* 상단 드라이버 선택 카드 */
    h+='<div class="card pad"><div class="h2hpick">'+h2hPickCard('a',A,colA)+
      '<div class="h2hvs">VS</div>'+h2hPickCard('b',B,colB)+'</div>'+
      '<div class="h2htools"><button class="h2htool" data-act="h2hSwap">⇄ 좌우 바꾸기</button>'+
      '<button class="h2htool" data-act="h2hMate">팀메이트로 비교</button></div></div>';
    /* 시즌 맞대결 스코어 */
    h+='<div class="card pad"><div class="summary"><b>시즌 맞대결 스코어</b><span class="sp"></span>'+
      '<span class="cr">'+c.done+'R 기준</span></div>'+
      h2hScoreRow('퀄리파잉 맞대결',c.qA,c.qB,colA,colBbar)+
      h2hScoreRow('레이스 맞대결',c.rA,c.rB,colA,colBbar)+
      h2hScoreRow('챔피언십 포인트',A.points,B.points,colA,colBbar)+
      h2hScoreRow('포디움',c.pA,c.pB,colA,colBbar)+
      h2hScoreRow('패스티스트 랩',c.fA,c.fB,colA,colBbar)+'</div>';
    /* 라운드별 성적: 1R ~ 완료된 전체 라운드 */
    var trs='';
    for(i=0;i<c.rows.length;i++){
      var row=c.rows[i];
      var ta=h2hPosTxt(row.ra),tb=h2hPosTxt(row.rb);
      trs+='<tr data-act="openRace" data-round="'+row.round+'" data-sess="race">'+
        '<td class="p rd">'+row.round+'</td>'+
        '<td class="d"><div class="gpn" style="font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">'+esc(gpKo(row.race))+'</div>'+
        '<div class="ln">'+esc(fmtDate(row.race.date))+'</div></td>'+
        '<td class="ca">'+h2hCell(ta,row.cmp===0,colA)+'</td>'+
        '<td class="cb">'+h2hCell(tb,row.cmp===1,colB)+'</td></tr>';
    }
    h+='<div class="card pad"><div class="summary"><b>라운드별 성적</b><span class="sp"></span>'+
      '<span class="cr">레이스 순위</span></div>'+
      '<table class="tbl h2ht"><thead><tr><th>R</th><th class="d">그랑프리</th>'+
      '<th class="ca">'+esc(A.code||'')+'</th><th class="cb">'+esc(B.code||'')+'</th></tr></thead><tbody>'+
      (trs||'<tr><td colspan="4" style="text-align:center;color:var(--dim2);padding:18px">완료된 라운드가 없습니다</td></tr>')+
      '</tbody></table></div>';
    h+='<div class="footnote">'+S.year+' 시즌 완료 라운드 '+c.done+'개 기준 · 두 선수 모두 예선·레이스 기록이 있는 라운드에서 맞대결 집계<br>'+
      'DNF = 리타이어 · DNS = 불참 · DSQ = 실격 · 행을 누르면 해당 그랑프리 결과로 이동</div>';
    MAIN.innerHTML=h;
  }).catch(function(e){ MAIN.innerHTML=driverSeg()+errBox(e.message||String(e)); });
}
/* 드라이버 선택 시트 */
var H2HSHEET=null;
function closeH2HSheet(){
  if(H2HSHEET&&H2HSHEET.parentNode) H2HSHEET.parentNode.removeChild(H2HSHEET);
  H2HSHEET=null;
  document.body.style.overflow='';
}
function teamMateOf(list,id){
  var a=null,i;
  for(i=0;i<list.length;i++) if(list[i].driverId===id) a=list[i];
  if(!a||!a.teamId) return null;
  for(i=0;i<list.length;i++){
    var d=list[i];
    if(d.driverId!==id&&d.teamId===a.teamId) return d.driverId;
  }
  return null;
}
function h2hListHTML(side,st){
  var out='',i,d,cur=(side==='a'?S.h2hA:S.h2hB),list=st.drivers||[];
  for(i=0;i<list.length;i++){
    d=list[i];
    out+='<button class="gpi'+(d.driverId===cur?' on':'')+'" data-act="h2hPick" data-side="'+side+'" data-driver="'+esc(d.driverId)+'">'+
      '<span class="rn2">'+(d.pos?('P'+d.pos):'—')+'</span>'+
      '<span class="mn"><span class="nm2">'+
      '<span class="bar" style="background:'+teamColor(d.teamId)+';height:13px;width:3px;flex:0 0 3px"></span>'+
      '<span class="g">'+esc(d.code||'')+' · '+esc(d.full||'')+'</span></span>'+
      '<span class="sb">'+esc(teamKo(d.teamId,d.team))+' · '+d.points+' pts</span></span></button>';
  }
  return out;
}
function openH2HSheet(side){
  closeH2HSheet();
  var st=SEASONS[S.year]&&SEASONS[S.year].standings;
  var wrap=document.createElement('div');
  wrap.className='sheetwrap';
  wrap.id='h2hSheet';
  wrap.innerHTML='<div class="sheetbg" data-act="h2hClose"></div>'+
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="드라이버 선택">'+
      '<div class="sheet-hd"><div class="t"><b>드라이버 선택</b>'+
      '<span>'+S.year+' 시즌 · '+(side==='a'?'왼쪽':'오른쪽')+'</span></div>'+
      '<button class="sheet-x" data-act="h2hClose" aria-label="닫기">✕</button></div>'+
      '<div class="sheet-list" id="h2hList">'+(st?h2hListHTML(side,st):'<div class="note">불러오는 중…</div>')+'</div></div>';
  document.body.appendChild(wrap);
  document.body.style.overflow='hidden';
  H2HSHEET=wrap;
  if(!st){
    getStandings(S.year).then(function(x){
      var l=document.getElementById('h2hList');
      if(l&&H2HSHEET===wrap) l.innerHTML=h2hListHTML(side,x);
    },function(e){
      var l=document.getElementById('h2hList');
      if(l&&H2HSHEET===wrap) l.innerHTML='<div class="note"><b>불러오지 못했습니다</b>'+esc(e.message||String(e))+'</div>';
    });
  }
}

/* ============================ 라우팅 ============================ */
function renderYears(){
  var h='',i;
  for(i=0;i<YEARS.length;i++){
    h+='<button class="y'+(YEARS[i]===S.year?' on':'')+'" data-act="year" data-year="'+YEARS[i]+'">'+YEARS[i]+'</button>';
  }
  document.getElementById('years').innerHTML=h;
  document.getElementById('hsub').textContent=S.year+' SEASON · FORMULA 1';
  var on=document.querySelector('.y.on');
  if(on && on.scrollIntoView) try{on.scrollIntoView({block:'nearest',inline:'center',behavior:'instant'});}catch(e){}
}
function navActive(){
  var m={schedule:'navSchedule',standings:'navStandings',search:'navSearch',race:'navRace'};
  ['navSchedule','navStandings','navSearch','navRace'].forEach(function(id){
    document.getElementById(id).classList.remove('on');
  });
  var id=m[S.view]||'navRace';
  if(S.view==='driver') id='navSearch';
  document.getElementById(id).classList.add('on');
}
function render(){
  renderYears();
  navActive();
  stopCountdown();
  try{ window.scrollTo(0,0); }catch(e){}
  if(S.view==='race') return renderRace();
  if(S.view==='schedule') return renderSchedule();
  if(S.view==='standings') return renderStandings();
  if(S.view==='search') return renderSearch();
  if(S.view==='driver') return renderDriver();
  return renderRace();
}
/* 연도 칩: 지금 보고 있는 탭(최신 경기·일정·순위·드라이버 상세)을 그대로 유지한 채 연도만 바꾼다.
   최신 경기 탭에서만 그 연도의 최신 라운드를 새로 고른다. */
function switchYear(y){
  S.year=y;
  return getRaces(y).then(function(races){
    S.round=lastDoneRound(races);
    /* 보던 세션(FP1·퀄리파잉·그리드 등)은 새 연도의 최신 라운드에 그 세션이 있으면 유지하고, 없을 때만 레이스 */
    var race=null,i;
    for(i=0;i<races.length;i++) if(races[i].round===S.round) race=races[i];
    S.session = race ? sessionFor(race,S.session) : 'race';
    return render();
  }).catch(function(e){ renderYears(); MAIN.innerHTML=errBox(e.message||String(e)); });
}

/* 헤더 '동기화': 내장 데이터를 버리고 라이브 API에서 다시 받는다 */
function doSync(){
  var btn=document.querySelector('[data-act="refresh"]');
  SYNC.at=Date.now();
  MEM={}; PEND={};
  dropAppStorage();
  var keys=Object.keys(SEASONS),i;
  for(i=0;i<keys.length;i++){
    var o=SEASONS[keys[i]];
    o.rounds={}; o.all={}; o.standings=null; o.of1=null; o.races=null;
  }
  if(btn) btn.classList.add('busy');
  var finish=function(){
    if(btn) btn.classList.remove('busy');
    try{ render(); }catch(e){}
  };
  Promise.all([
    getRaces(S.year).catch(function(){}),
    getStandings(S.year).catch(function(){}),
    getOF1(S.year).catch(function(){})
  ]).then(finish,finish);
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b) return;
  var act=b.getAttribute('data-act');
  try{
    if(act==='year'){ if(+b.getAttribute('data-year')!==S.year){ GRID.data=null; S.gridMode='race'; if(S.view==='race') BACK=[]; switchYear(+b.getAttribute('data-year')); } }
    else if(act==='home'){
      /* SIMPLY LOVELY 타이틀: 앱을 처음 열었을 때의 기본 화면(기본 연도·최신 경기·레이스)으로 */
      BACK=[]; GRID.data=null; GRID.race=null; S.gridMode='race';
      S.year=CUR_YEAR; S.view='race'; S.session='race'; S.round=0;
      S.driverId=null; S.driverCode=null; S.standingTab='driver';
      S.driverTab='search'; S.h2hA=null; S.h2hB=null; closeH2HSheet();
      var qEl=document.getElementById('q'); if(qEl) qEl.value='';
      render();
    }
    else if(act==='nav'){
      var v=b.getAttribute('data-view');
      BACK=[];
      if(v==='race' && S.view!=='race'){ S.session='race'; }
      S.view=v; render();
    }
    else if(act==='openRace'){ BACK=[]; S.round=+b.getAttribute('data-round'); S.session=b.getAttribute('data-sess')||'race'; S.gridMode='race'; GRID.data=null; S.view='race'; render(); }
    else if(act==='tab'){ S.session=b.getAttribute('data-sess'); if(S.view!=='race'){S.view='race';} render(); }
    else if(act==='gpPick'){ openGpSheet(); }
    else if(act==='prevGp'){
      var curSess=S.session, curYear=S.year, curRound=S.round;
      prevGpRace(curYear).then(function(target){
        if(!target) return;
        /* 목표 주말에 지금 보던 세션이 있으면(Fp1·퀄리파잉·SQ·스프린트·그리드 등) 그 세션 그대로 이동, 없으면 레이스 */
        BACK.push({year:curYear,round:curRound,session:curSess});   /* 돌아올 자리를 쌓아 둔다 */
        S.year=curYear-1; S.round=target.round; S.session=sessionFor(target,curSess); S.gridMode='race';
        GRID.data=null; S.view='race';
        render();
      });
    }
    else if(act==='backGp'){
      var st=BACK.pop();
      if(!st) return;
      S.year=st.year; S.round=st.round; S.session=st.session; S.gridMode='race';
      GRID.data=null; S.view='race';
      render();
    }
    else if(act==='gpClose'){ closeGpSheet(); }
    else if(act==='gpGo'){
      var rd=+b.getAttribute('data-round');
      closeGpSheet();
      if(rd!==S.round || S.view!=='race'){
        BACK=[];
        S.round=rd; S.session='race'; S.gridMode='race'; GRID.data=null; S.view='race'; render();
      }
    }
    else if(act==='step'){
      var dir=+b.getAttribute('data-dir');
      getRaces(S.year).then(function(races){
        var i=0; for(i=0;i<races.length;i++) if(races[i].round===S.round) break;
        var n=i+dir;
        if(n<0||n>=races.length) return;
        BACK=[];
        S.round=races[n].round; S.session='race'; S.view='race'; render();
      });
    }
    else if(act==='standTab'){ S.standingTab=b.getAttribute('data-tab'); render(); }
    else if(act==='driverTab'){ S.driverTab=b.getAttribute('data-tab'); render(); }
    else if(act==='h2hSheet'){ openH2HSheet(b.getAttribute('data-side')); }
    else if(act==='h2hClose'){ closeH2HSheet(); }
    else if(act==='h2hPick'){
      var side=b.getAttribute('data-side'),pid=b.getAttribute('data-driver');
      /* 같은 선수를 반대쪽에서 고르면 자동 스왑 */
      if(side==='a'){ if(pid===S.h2hB){ S.h2hB=S.h2hA; } S.h2hA=pid; }
      else { if(pid===S.h2hA){ S.h2hA=S.h2hB; } S.h2hB=pid; }
      closeH2HSheet();
      render();
    }
    else if(act==='h2hSwap'){ var sw=S.h2hA; S.h2hA=S.h2hB; S.h2hB=sw; render(); }
    else if(act==='h2hMate'){
      getStandings(S.year).then(function(st){
        var mate=teamMateOf(st.drivers||[],S.h2hA);
        if(mate){ S.h2hB=mate; render(); }
      },function(){});
    }
    else if(act==='gridReason'){ toggleGridReason(b); }
    else if(act==='gridMode'){
      S.gridMode=b.getAttribute('data-mode');
      var sb=document.getElementById('sessBody');
      if(sb) sb.innerHTML=sessionTable({kind:'grid'},GRID.race);
    }
    else if(act==='openDriver'){ S.driverId=b.getAttribute('data-driver'); S.driverCode=b.getAttribute('data-code'); S.view='driver'; render(); }
    else if(act==='retry'){ delete MEM['__']; render(); }
    else if(act==='refresh'){ doSync(); }
  }catch(e){ /* noop */ }
});
document.addEventListener('input',function(ev){
  if(ev.target && ev.target.id==='q') onSearchInput(ev.target.value);
});
/* 타이틀은 div라 키보드 Enter/Space도 클릭으로 처리 */
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter' && ev.key!==' ') return;
  var t=ev.target;
  if(t && t.closest && t.tagName!=='BUTTON' && t.closest('[data-act="home"]')){
    ev.preventDefault();
    t.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  }
});

/* 시작 */
CURRENT_TODAY=CURRENT_TODAY||null;
render();
})();
